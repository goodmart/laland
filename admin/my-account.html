<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার হিসাব - Laland Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 pb-12">
  <header class="bg-emerald-700 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2"><i class="fa-solid fa-book text-xl"></i><h1 class="font-bold text-base">আমার হিসাব (My Account Statement)</h1></div>
      <nav></nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">
    <p id="msg" class="text-sm text-gray-500">লোড হচ্ছে...</p>

    <div id="who" class="hidden bg-white border rounded-2xl p-3 flex items-center gap-2 text-xs">
      <i class="fa-solid fa-user-tie text-emerald-700"></i><span class="text-gray-500">কার হিসাব:</span>
      <select id="mgrSel" class="flex-1 px-2 py-1.5 border rounded-lg text-sm bg-white"></select>
    </div>

    <div id="cards" class="hidden grid grid-cols-3 gap-2"></div>

    <div id="tabs" class="hidden flex flex-wrap gap-2 text-sm font-bold">
      <button data-t="money" class="tab px-4 py-2 rounded-xl">টাকার হিসাব</button>
      <button data-t="activity" class="tab px-4 py-2 rounded-xl">স্টক ও অন্যান্য কার্যকলাপ</button>
      <button data-t="close" class="tab px-4 py-2 rounded-xl">দিন শেষের মিল</button>
    </div>

    <!-- ===== টাকার হিসাব (monthly statement) ===== -->
    <section id="moneyBox" class="hidden space-y-3">
      <div class="bg-white border rounded-2xl p-3 flex flex-wrap items-center gap-2 text-sm">
        <button id="mPrev" class="px-3 py-1.5 border rounded-lg hover:bg-gray-50" title="আগের মাস"><i class="fa-solid fa-chevron-left"></i></button>
        <select id="mSel" class="px-3 py-1.5 border rounded-lg bg-white font-bold"></select>
        <button id="mNext" class="px-3 py-1.5 border rounded-lg hover:bg-gray-50" title="পরের মাস"><i class="fa-solid fa-chevron-right"></i></button>
        <span id="mBadge" class="text-[11px] font-bold px-2 py-1 rounded-full"></span>
        <span class="flex-1"></span>
        <button id="mClose" class="hidden px-3 py-1.5 rounded-lg bg-amber-500 text-white text-xs font-bold"><i class="fa-solid fa-lock mr-1"></i>এই মাস ক্লোজ করুন</button>
        <button id="csvBtn" class="px-3 py-1.5 rounded-lg border bg-white text-gray-600 text-xs"><i class="fa-solid fa-file-csv mr-1"></i>Excel/CSV</button>
        <button id="refBtn" class="px-3 py-1.5 rounded-lg border bg-white text-gray-600 text-xs"><i class="fa-solid fa-rotate mr-1"></i>রিফ্রেশ</button>
      </div>
      <p id="accNote" class="text-[11px] text-gray-500 bg-white border rounded-xl px-3 py-2"></p>
      <div id="mSum" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
      <div id="mFlags" class="flex flex-wrap gap-2 text-xs"></div>
      <div id="mTable" class="hidden sm:block bg-white border rounded-2xl overflow-x-auto"></div>
      <div id="mCards" class="sm:hidden bg-white border rounded-2xl divide-y overflow-hidden"></div>
    </section>

    <!-- ===== স্টক ও অন্যান্য কার্যকলাপ ===== -->
    <section id="actBox" class="hidden space-y-3">
      <p class="text-[11px] text-gray-500 bg-white border rounded-xl px-3 py-2">স্টক রিসিভ, সাপ্লায়ার রিটার্ন, হ্যান্ডওভার ও দিন শেষের গণনা জমা। এখানে শুধু পণ্য ও পিস দেখানো হয়। টাকার হিসাব "টাকার হিসাব" ট্যাবে।</p>
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span id="cats" class="flex flex-wrap gap-2"></span>
        <span class="flex-1"></span>
        <button data-f="all" class="chip px-3 py-1.5 rounded-full">সব সময়</button>
        <button data-f="7" class="chip px-3 py-1.5 rounded-full">৭ দিন</button>
        <button data-f="30" class="chip px-3 py-1.5 rounded-full">৩০ দিন</button>
      </div>
      <div id="actList" class="space-y-2"></div>
    </section>

    <div id="closeList" class="hidden space-y-2"></div>
  </main>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, limit, startAfter, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

    const cfg = { apiKey: "AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U", authDomain: "laland-express.firebaseapp.com", projectId: "laland-express", storageBucket: "laland-express.firebasestorage.app", messagingSenderId: "315462688826", appId: "1:315462688826:web:a6b033e1ce664071201503" };
    const app = getApps().length ? getApp() : initializeApp(cfg);
    const auth = getAuth(app), db = getFirestore(app), fns = getFunctions(app);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const r2 = (n) => Math.round(Number(n || 0) * 100) / 100;
    const num = (n) => Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const money = (n) => '৳ ' + num(n);
    const dayOf = (iso) => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Dhaka' });
    const timeOf = (iso) => new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Asia/Dhaka', hour: '2-digit', minute: '2-digit', hour12: false });
    const shortDay = (iso) => new Date(iso).toLocaleDateString('en-GB', { timeZone: 'Asia/Dhaka', day: '2-digit', month: 'short' });
    const curMonth = () => dayOf(new Date().toISOString()).slice(0, 7);
    const monthRange = (m) => { const [y, mo] = m.split('-').map(Number); const nx = mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`;
      return { startISO: new Date(`${m}-01T00:00:00+06:00`).toISOString(), endISO: new Date(`${nx}-01T00:00:00+06:00`).toISOString() }; };
    const prevDay = (d) => new Date(new Date(d + 'T00:00:00Z').getTime() - 86400000).toISOString().slice(0, 10);
    const BN_MONTH = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
    const monthName = (m) => `${BN_MONTH[Number(m.slice(5, 7)) - 1]} ${m.slice(0, 4)}`;

    // Ledger convention (server): amount > 0 = debit, amount < 0 = credit.
    //   cash       : + cash came to my hand,  - cash left my hand
    //   receivable : + I owe the company more (shortage), - my dues went down
    //   salary     : stored as a credit (negative); sign -1 flips it so that + = money owed TO me
    const ACCTS = {
      cash:       { suffix: 'cash',       sign: 1,  title: 'হাতে থাকা ক্যাশ', plus: 'জমা (+)', minus: 'খরচ (−)', plusCls: 'text-emerald-700', minusCls: 'text-rose-600',
                    note: 'আপনার কাছে সিস্টেম অনুযায়ী যত ক্যাশ থাকার কথা। রাইডার ক্যাশ জমা দিলে বাড়ে; রিফান্ড দিলে বা মাস্টারকে হস্তান্তর করলে কমে। দিন শেষে গণনার সাথে মিলিয়ে ঘাটতি/বাড়তি ধরা হয়।' },
      receivable: { suffix: 'receivable', sign: 1,  title: 'আমার বকেয়া (দায়)', plus: 'দায় বাড়ল (+)', minus: 'দায় কমল (−)', plusCls: 'text-rose-600', minusCls: 'text-emerald-700',
                    note: 'দিন শেষে ক্যাশ কম পাওয়া গেলে এখানে বকেয়া হিসেবে জমা হয়। টাকা পরিশোধ করলে বা বেতন থেকে কাটা গেলে কমে।' },
      salary:     { suffix: 'salary',     sign: -1, title: 'আমার পাওনা', plus: 'পাওনা বাড়ল (+)', minus: 'পাওনা কমল (−)', plusCls: 'text-emerald-700', minusCls: 'text-rose-600',
                    note: 'মাসের বেতন ও দিন শেষে পাওয়া বাড়তি ক্যাশ এখানে জমা হয়। বকেয়া কাটা গেলে বা উত্তোলন করলে কমে।' }
    };
    const TYPE_LBL = {
      rider_settlement: 'রাইডারের ক্যাশ জমা', manager_surplus: 'দিন শেষে বাড়তি', manager_shortage: 'দিন শেষে ঘাটতি', manager_repay: 'বকেয়া পরিশোধ',
      wallet_transfer: 'রিফান্ড ক্যাশ মাস্টারকে', menu_refund_cash: 'কাস্টমার রিফান্ড', menu_refund_cash_reversed: 'রিফান্ড ফেরত',
      manager_salary: 'মাসিক বেতন', manager_salary_deduction: 'বেতন থেকে কাটা', manager_salary_cashout: 'পাওনা উত্তোলন', cash_handover: 'মাস্টারকে ক্যাশ জমা'
    };
    const OVERRIDE = {
      receivable: { manager_shortage: 'ঘাটতির টাকা আমার বকেয়ায় যোগ হয়েছে', manager_repay: 'বকেয়া পরিশোধ করেছি', manager_salary_deduction: 'বেতন থেকে বকেয়া কাটা হয়েছে' },
      salary: { manager_surplus: 'বাড়তি ক্যাশ আমার পাওনায় যোগ হয়েছে', manager_salary_deduction: 'বেতন থেকে বকেয়া কাটা হয়েছে', manager_salary: 'মাসিক বেতন জমা' }
    };

    let role = '', myUid = '', viewUid = '', tab = 'money', accKey = 'cash', month = curMonth(), filter = 'all', cat = 'all';
    let raw = {}, closesByDay = null, act = null, view = null;
    const accId = (k) => `mgr:${viewUid}:${ACCTS[k].suffix}`;

    // ================= cards =================
    async function loadBalances() {
      raw = {};
      for (const k of Object.keys(ACCTS)) {
        try { const s = await getDoc(doc(db, 'account_balances', accId(k))); raw[k] = s.exists() ? Number(s.data().balance || 0) : 0; } catch (e) { raw[k] = 0; }
      }
      drawCards();
    }
    function drawCards() {
      $('cards').innerHTML = Object.keys(ACCTS).map(k => {
        const v = r2(raw[k] * ACCTS[k].sign), sel = k === accKey && tab === 'money';
        const bad = k === 'receivable' ? v > 0 : v < 0;
        return `<button data-card="${k}" class="text-left rounded-2xl p-3 border shadow-sm ${sel ? 'bg-emerald-50 border-emerald-500 ring-1 ring-emerald-400' : 'bg-white hover:bg-emerald-50'}">
          <p class="text-[10px] sm:text-[11px] text-gray-500">${ACCTS[k].title}</p><p class="text-base sm:text-xl font-extrabold ${bad ? 'text-rose-600' : 'text-gray-800'}">${money(v)}</p></button>`;
      }).join('');
    }

    // ================= monthly statement =================
    function fillMonths() {
      const opts = []; let y = Number(curMonth().slice(0, 4)), m = Number(curMonth().slice(5, 7));
      for (let i = 0; i < 24; i++) { opts.push(`${y}-${String(m).padStart(2, '0')}`); m--; if (m === 0) { m = 12; y--; } }
      $('mSel').innerHTML = opts.map(o => `<option value="${o}">${monthName(o)}</option>`).join('');
      $('mSel').value = month;
    }

    async function loadClosesByDay() {
      if (closesByDay) return;
      closesByDay = {};
      try { (await getDocs(query(collection(db, 'day_closes'), where('uid', '==', viewUid)))).docs.forEach(d => { const r = d.data(); closesByDay[r.dayKey] = r; }); } catch (e) { console.warn('day_closes', e.message); }
    }

    async function loadMonth() {
      $('mSum').innerHTML = ''; $('mTable').innerHTML = ''; $('mFlags').innerHTML = '';
      $('mCards').innerHTML = '<p class="text-xs text-gray-400 text-center py-6">লোড হচ্ছে...</p>';
      const a = ACCTS[accKey], { startISO, endISO } = monthRange(month);
      await loadClosesByDay();
      // every line from the start of the month up to now (balance-now minus those lines = the opening balance)
      const all = []; let cursor = null;
      try {
        for (;;) {
          const parts = [where('accountId', '==', accId(accKey)), where('createdAt', '>=', startISO), orderBy('createdAt', 'desc'), limit(500)];
          if (cursor) parts.push(startAfter(cursor));
          const snap = await getDocs(query(collection(db, 'ledger'), ...parts));
          snap.docs.forEach(d => all.push({ id: d.id, ...d.data() }));
          if (snap.docs.length < 500) break; cursor = snap.docs[snap.docs.length - 1];
        }
      } catch (e) {
        const needIdx = /index/i.test(e.message || '');
        $('mCards').innerHTML = `<p class="text-sm text-rose-700 p-4">${needIdx ? 'ডেটাবেস ইনডেক্স এখনো চালু হয়নি। অ্যাডমিনকে বলুন: firebase deploy --only firestore:indexes' : 'লোড ব্যর্থ: ' + esc(e.message)}</p>`;
        return;
      }
      const laterSum = all.filter(l => l.createdAt >= endISO).reduce((t, l) => t + Number(l.amount || 0), 0);
      const inM = all.filter(l => l.createdAt < endISO).sort((x, y) => String(x.createdAt).localeCompare(String(y.createdAt)));
      const closingRaw = r2(raw[accKey] - laterSum);
      const plusRaw = r2(inM.filter(l => l.amount > 0).reduce((t, l) => t + l.amount, 0));
      const minusRaw = r2(inM.filter(l => l.amount < 0).reduce((t, l) => t - l.amount, 0));
      const openingRaw = r2(closingRaw - (plusRaw - minusRaw));

      // rider names for settlement lines
      const ids = [...new Set(inM.filter(l => l.type === 'rider_settlement' && l.refId).map(l => l.refId))];
      const settle = {};
      await Promise.all(ids.map(async id => { try { const s = await getDoc(doc(db, 'cash_settlements', id)); if (s.exists()) settle[id] = s.data(); } catch (e) { /* name stays generic */ } }));
      const hIds = [...new Set(inM.filter(l => l.type === 'cash_handover' && l.refId).map(l => l.refId))];
      const hand = {};
      await Promise.all(hIds.map(async id => { try { const s = await getDoc(doc(db, 'cash_handovers', id)); if (s.exists()) hand[id] = s.data(); } catch (e) { /* ignore */ } }));

      // rows (oldest first, like the Excel sheet) with running balance
      let run = openingRaw, lossTotal = 0, surplusTotal = 0;
      const rows = inM.map(l => {
        run = r2(run + Number(l.amount || 0));
        const v = r2(Number(l.amount || 0) * a.sign);
        const lbl = (OVERRIDE[accKey] && OVERRIDE[accKey][l.type]) || TYPE_LBL[l.type] || l.type;
        let part = lbl, by = '', flag = null;
        if (l.type === 'rider_settlement') {
          const s = settle[l.refId]; by = s ? (s.riderName || 'রাইডার') : 'রাইডার';
          part = `রাইডার ${by} এর ক্যাশ জমা নিলাম` + (s ? ` · ${s.method || ''} · ${(s.invoices || []).length}টি ইনভয়েস` : '');
        } else if (l.type === 'manager_shortage' || l.type === 'manager_surplus') {
          const cd = prevDay(l.dayKey), c = closesByDay[cd]; by = 'সিস্টেম (দিন শেষ)';
          if (accKey === 'cash') part = (l.type === 'manager_shortage' ? 'দিন শেষে ক্যাশ কম পাওয়া গেছে' : 'দিন শেষে ক্যাশ বেশি পাওয়া গেছে');
          if (c && typeof c.counted === 'number') part += ` (${cd}: আমি গুনেছি ${num(c.counted)}, সিস্টেমে ${num(c.expected)})`;
          const amt = Math.abs(Number(l.amount || 0));
          flag = { kind: l.type === 'manager_shortage' ? 'loss' : 'surplus', amt };
          if (accKey === 'cash') { if (flag.kind === 'loss') lossTotal += amt; else surplusTotal += amt; }
        } else if (l.type === 'cash_handover') {
          const h = hand[l.refId]; by = h && h.confirmedByName ? 'মাস্টার ' + h.confirmedByName : 'মাস্টার';
          part = 'মাস্টারকে ক্যাশ জমা দিলাম' + (h && h.note ? ' · ' + h.note : '');
        } else if (['manager_salary', 'manager_salary_deduction'].includes(l.type)) by = 'সিস্টেম';
        return { at: l.createdAt, part, by, typeLbl: TYPE_LBL[l.type] || l.type, ref: l.refId || '', v, flag, bal: r2(run * a.sign) };
      });
      view = { month, accKey, a, opening: r2(openingRaw * a.sign), closing: r2(closingRaw * a.sign), plus: 0, minus: 0, rows, openingRaw, closingRaw, plusRaw, minusRaw, lossTotal: r2(lossTotal), surplusTotal: r2(surplusTotal) };
      rows.forEach(r => { if (r.v > 0) view.plus += r.v; else view.minus += -r.v; });
      view.plus = r2(view.plus); view.minus = r2(view.minus);
      await drawBadge(closingRaw);
      drawStatement();
    }

    async function drawBadge(closingRaw) {
      const b = $('mBadge'); $('mClose').classList.add('hidden');
      if (month >= curMonth()) { b.className = 'text-[11px] font-bold px-2 py-1 rounded-full bg-sky-100 text-sky-700'; b.textContent = 'চলমান মাস (এখনো ক্লোজ হয়নি)'; return; }
      try {
        const s = await getDoc(doc(db, 'manager_month_closes', `${viewUid}_${month}`));
        if (s.exists()) {
          const rec = s.data(), snapClosing = rec.accounts && rec.accounts[accKey] ? Number(rec.accounts[accKey].closing) : null;
          if (snapClosing !== null && Math.abs(snapClosing - closingRaw) > 0.01) { b.className = 'text-[11px] font-bold px-2 py-1 rounded-full bg-rose-100 text-rose-700'; b.textContent = 'ক্লোজ রেকর্ডের সাথে মিলছে না, মাস্টারকে জানান'; }
          else { b.className = 'text-[11px] font-bold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700'; b.textContent = '✔ মাস ক্লোজড · ' + dayOf(rec.closedAt); }
          return;
        }
      } catch (e) { /* no permission or no record */ }
      b.className = 'text-[11px] font-bold px-2 py-1 rounded-full bg-amber-100 text-amber-700'; b.textContent = 'ক্লোজ রেকর্ড নেই';
      if (role === 'master') $('mClose').classList.remove('hidden');
    }

    function drawStatement() {
      const v = view, a = v.a, nm = monthName(v.month);
      $('accNote').textContent = a.note;
      $('mSum').innerHTML = [
        ['Opening Balance (মাসের শুরু)', money(v.opening), 'text-gray-800'],
        [a.plus + ' মোট', '+ ' + money(v.plus), a.plusCls],
        [a.minus + ' মোট', '− ' + money(v.minus), a.minusCls],
        ['Closing Balance (মাসের শেষ)', money(v.closing), 'text-emerald-800']
      ].map(([l, x, c]) => `<div class="bg-white border rounded-2xl p-3"><p class="text-[10px] text-gray-500">${l}</p><p class="text-base sm:text-lg font-extrabold ${c}">${x}</p></div>`).join('');
      $('mFlags').innerHTML = (v.accKey === 'cash' && (v.lossTotal || v.surplusTotal))

    function exportCsv() {
      if (!view) return;
      const v = view, a = v.a;

        ['', '', 'Total / Closing Balance', '', '', 'CLS-' + v.month.replace('-', ''), v.plus, v.minus, '', v.closing]];
      const csv = [head, ...out].map(row => row.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
      const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));

    // ================= স্টক ও অন্যান্য কার্যকলাপ =================

      handover: ['হ্যান্ডওভার', 'fa-handshake', 'bg-amber-100 text-amber-700'], cash: ['ক্যাশ জমা', 'fa-hand-holding-dollar', 'bg-emerald-100 text-emerald-700'], close: ['দিন শেষ', 'fa-calendar-check', 'bg-sky-100 text-sky-700'] };
    const pcs = (arr) => (arr || []).reduce((t, i) => t + Number(i.qty || 0), 0);
    async function loadActivity() {
      const items = [], warn = [];

        (await getDocs(query(collection(db, 'day_closes'), where('uid', '==', viewUid)))).docs.forEach(d => { const r = d.data();

          else if (r.status === 'not_counted') items.push({ cat: 'close', at: r.createdAt, title: 'গণনা জমা দেওয়া হয়নি', ref: r.dayKey, detail: `সিস্টেমে ক্যাশ ছিল ${money(r.expected)}` }); });
      });
      await safe('stock_in_pending', async () => {

          items.push({ cat: 'stockin', at: r.receivedAt, title: 'চালান রিসিভ করলাম (স্টকে যুক্ত)', ref: r.invoiceNo || d.id, detail: `${r.vendor} · ${(r.items || []).length}টি পণ্য · ${pcs(r.items)} পিস`, lines: r.items }); });
        (await getDocs(query(collection(db, 'stock_in_pending'), where('rejectedBy', '==', viewUid)))).docs.forEach(d => { const r = d.data();
          items.push({ cat: 'stockin', at: r.rejectedAt, title: 'চালান ফেরত দিলাম (রিসিভ করিনি)', ref: r.invoiceNo || d.id, detail: `${r.vendor} · ${pcs(r.items)} পিস · কারণ: ${r.rejectReason || ''}`, lines: r.items }); });
      });
      await safe('supplier_returns', async () => {
        (await getDocs(query(collection(db, 'supplier_returns'), where('createdBy', '==', viewUid)))).docs.forEach(d => { const r = d.data();
          const tl = r.type === 'damage' ? 'Damage' : 'Fresh', base = `${r.vendor} · ${tl} · ${(r.items || []).length}টি পণ্য · ${r.totalQty} পিস`;
          items.push({ cat: 'return', at: r.createdAt, title: 'সাপ্লায়ার রিটার্ন জমা দিলাম (অপেক্ষমাণ)', ref: r.returnNo, detail: base + ` · কারণ: ${r.reason || ''}`, lines: r.items });
          if (r.confirmedAt) items.push({ cat: 'return', at: r.confirmedAt, title: 'ভেন্ডর কনফার্ম করেছে (স্টক কমেছে)', ref: r.returnNo, detail: base });
          if (r.cancelledAt) items.push({ cat: 'return', at: r.cancelledAt, title: 'রিটার্ন বাতিল হয়েছে (স্টক বদলায়নি)', ref: r.returnNo, detail: base }); });
      });
      await safe('cash_handovers', async () => {
        (await getDocs(query(collection(db, 'cash_handovers'), where('uid', '==', viewUid)))).docs.forEach(d => { const r = d.data(), m = money(r.amount);
          items.push({ cat: 'cash', at: r.createdAt, title: 'মাস্টারকে ক্যাশ জমার অনুরোধ পাঠালাম', ref: r.handoverNo, detail: `${m}${r.note ? ' · ' + r.note : ''}` });
          if (r.confirmedAt) items.push({ cat: 'cash', at: r.confirmedAt, title: 'মাস্টার ক্যাশ গ্রহণ নিশ্চিত করেছেন', ref: r.handoverNo, detail: `${m} · ${r.confirmedByName || ''}` });
          if (r.rejectedAt) items.push({ cat: 'cash', at: r.rejectedAt, title: 'মাস্টার অস্বীকার করেছেন', ref: r.handoverNo, detail: `${m} · কারণ: ${r.rejectReason || ''}` });
          if (r.cancelledAt) items.push({ cat: 'cash', at: r.cancelledAt, title: 'জমার অনুরোধ বাতিল করেছি', ref: r.handoverNo, detail: m }); });
      });
      await safe('store_handovers', async () => {
        const seen = new Set();
        for (const side of ['toUid', 'fromUid']) (await getDocs(query(collection(db, 'store_handovers'), where(side, '==', viewUid)))).docs.forEach(d => {
          if (seen.has(d.id)) return; seen.add(d.id); const r = d.data(), toMe = r.toUid === viewUid;
          const base = `${toMe ? 'দিয়েছেন ' + (r.fromName || '') : 'পেয়েছেন ' + (r.toName || '')} · ${r.productCount || 0}টি পণ্য · ${r.totalQty || 0} পিস`;
          items.push({ cat: 'handover', at: r.createdAt, title: toMe ? 'আমাকে স্টক হ্যান্ডওভার পাঠানো হয়েছে' : 'আমি স্টক হ্যান্ডওভার দিলাম', ref: r.id, detail: base });
          if (r.acceptedAt) items.push({ cat: 'handover', at: r.acceptedAt, title: 'হ্যান্ডওভার গৃহীত' + (r.differenceCount ? ` (${r.differenceCount}টি পণ্যে পার্থক্য)` : ''), ref: r.id, detail: base });
          if (r.cancelledAt) items.push({ cat: 'handover', at: r.cancelledAt, title: 'হ্যান্ডওভার বাতিল', ref: r.id, detail: base }); });
      });
      act = { items: items.filter(x => x.at).sort((a, b) => String(b.at).localeCompare(String(a.at))), warn };
    }
    const inFilter = (iso) => filter === 'all' || (Date.now() - new Date(iso).getTime()) <= Number(filter) * 86400000;
    function drawActivity() {
      document.querySelectorAll('.chip').forEach(b => b.className = 'chip px-3 py-1.5 rounded-full ' + (b.dataset.f === filter ? 'bg-emerald-600 text-white' : 'bg-white border text-gray-600'));
      $('cats').innerHTML = [['all', 'সব'], ...Object.entries(CATS).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button data-cat="${k}" class="px-3 py-1.5 rounded-full ${k === cat ? 'bg-gray-800 text-white' : 'bg-white border text-gray-600'}">${l}</button>`).join(' ');
      const list = (act.items || []).filter(x => (cat === 'all' || x.cat === cat) && inFilter(x.at));
      if (!list.length) { $('actList').innerHTML = '<p class="text-sm text-gray-400 bg-white border rounded-2xl p-6 text-center">এই সময়ে কিছু নেই।</p>'; return; }
      let html = '', cur = '', rows = '';
      const flush = () => { if (cur) html += `<div class="bg-white border rounded-2xl overflow-hidden"><div class="bg-gray-50 px-3 py-2 text-xs font-bold">${cur}</div><div class="divide-y">${rows}</div></div>`; rows = ''; };
      for (const x of list) {
        const d = dayOf(x.at); if (d !== cur) { flush(); cur = d; }
        const c = CATS[x.cat];
        const lines = x.lines && x.lines.length ? `<details class="mt-1"><summary class="text-[10px] text-gray-500 cursor-pointer">পণ্যের তালিকা</summary><div class="text-[11px] text-gray-600 pl-2">${x.lines.map(i => `${esc(i.name)} × ${Number(i.qty)}`).join('<br>')}</div></details>` : '';
        rows += `<div class="px-3 py-2.5 text-xs space-y-1"><div class="flex justify-between gap-2"><p class="font-bold"><span class="inline-block px-1.5 py-0.5 mr-1 rounded text-[10px] ${c[2]}"><i class="fa-solid ${c[1]}"></i> ${c[0]}</span>${esc(x.title)}</p><span class="text-[10px] text-gray-400 whitespace-nowrap">${timeOf(x.at)}</span></div>
          ${x.detail ? `<p class="text-gray-600">${esc(x.detail)}</p>` : ''}${lines}${x.ref ? `<p class="text-[10px] text-gray-400">রেফারেন্স: ${esc(String(x.ref).slice(0, 40))}</p>` : ''}</div>`;
      }
      flush();
      $('actList').innerHTML = (act.warn.length ? `<p class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-2">কিছু অংশ লোড হয়নি: ${act.warn.map(esc).join(', ')}</p>` : '') + html;

    // ================= দিন শেষের মিল =================
    async function drawClose() {
      $('closeList').innerHTML = '<p class="text-xs text-gray-400 text-center py-6">লোড হচ্ছে...</p>';
      try {
        const rows = (await getDocs(query(collection(db, 'day_closes'), where('uid', '==', viewUid)))).docs.map(d => d.data()).sort((x, y) => String(y.dayKey).localeCompare(String(x.dayKey)));

      fillMonths(); ['cards', 'tabs'].forEach(id => $(id).classList.remove('hidden')); $('msg').classList.add('hidden');
      await fullReload();
    });
  </script>
  <script type="module" src="admin-nav.js"></script>
</body>
