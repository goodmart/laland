<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Value - Laland Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>@media print{header,#tools,#adSide{display:none!important}body.ad-shell{padding-left:0!important}}</style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">
  <header class="bg-emerald-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2"><i class="fa-solid fa-scale-balanced text-xl"></i><h1 class="font-bold text-base">Stock Value (স্টক ভ্যালু)</h1></div>
      <nav></nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-4">
    <p id="msg" class="text-sm text-gray-500">লোড হচ্ছে...</p>
    <div id="cards" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3"></div>

    <div id="tools" class="hidden bg-white rounded-2xl border p-3 flex flex-wrap gap-2 items-center text-sm">
      <input id="q" placeholder="নাম / SKU খুঁজুন..." class="flex-1 min-w-[160px] px-3 py-2 border rounded-xl">
      <select id="cat" class="px-3 py-2 border rounded-xl"><option value="">সব ক্যাটাগরি</option></select>
      <select id="sup" class="px-3 py-2 border rounded-xl"><option value="">সব সাপ্লায়ার</option></select>
      <label class="flex items-center gap-1"><input type="checkbox" id="only" checked> শুধু stock আছে</label>
      <select id="sort" class="px-3 py-2 border rounded-xl">
        <option value="val">বেশি ভ্যালু আগে</option><option value="name">নাম</option><option value="qty">বেশি পিস আগে</option>
      </select>
      <button id="csv" class="px-3 py-2 bg-gray-700 text-white rounded-xl font-bold"><i class="fa-solid fa-file-csv mr-1"></i> CSV</button>
      <button onclick="window.print()" class="px-3 py-2 bg-gray-700 text-white rounded-xl font-bold"><i class="fa-solid fa-print mr-1"></i> প্রিন্ট</button>
    </div>

    <div class="bg-white rounded-2xl border shadow-sm overflow-x-auto">
      <table class="w-full text-xs">
        <thead id="thead" class="bg-gray-50 text-gray-500 uppercase"></thead>
        <tbody id="tbody" class="divide-y"></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const cfg = { apiKey: "AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U", authDomain: "laland-express.firebaseapp.com", projectId: "laland-express", storageBucket: "laland-express.firebasestorage.app", messagingSenderId: "315462688826", appId: "1:315462688826:web:a6b033e1ce664071201503" };
    const app = getApps().length ? getApp() : initializeApp(cfg);
    const auth = getAuth(app), db = getFirestore(app);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => '৳ ' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });

    let role = '', all = [], view = [];
    const showTp = () => role === 'master';          // store manager never sees TP / profit

    function compute() {
      const q = $('q').value.trim().toLowerCase(), cat = $('cat').value, sup = $('sup').value, only = $('only').checked;
      view = all.filter(p => (!only || p.qty > 0) && (!cat || p.category === cat) && (!sup || p.supplier === sup)
        && (!q || (p.name + ' ' + p.sku).toLowerCase().includes(q)));
      const s = $('sort').value;
      view.sort((a, b) => s === 'name' ? a.name.localeCompare(b.name) : s === 'qty' ? b.qty - a.qty : b.vPrice - a.vPrice);
      const sum = (f) => view.reduce((t, p) => t + f(p), 0);
      const card = (t, v, c = 'text-gray-800') => `<div class="bg-white rounded-2xl border p-4 shadow-sm"><p class="text-[11px] text-gray-500">${t}</p><p class="text-lg font-extrabold ${c}">${v}</p></div>`;
      $('cards').innerHTML =
        card('মোট পণ্য / পিস', view.filter(p => p.qty > 0).length + ' / ' + sum(p => p.qty).toLocaleString('en-IN')) +
        (showTp() ? card('ক্রয় মূল্যে (TP) মোট', money(sum(p => p.vTp)), 'text-blue-700') : '') +
        card('MRP-তে মোট', money(sum(p => p.vMrp)), 'text-amber-700') +
        card('বিক্রয় (ডিসকাউন্ট) দামে মোট', money(sum(p => p.vPrice)), 'text-emerald-700') +
        (showTp() ? card('সম্ভাব্য লাভ (বিক্রয় − TP)', money(sum(p => p.vPrice) - sum(p => p.vTp)), 'text-purple-700') : '');
      $('thead').innerHTML = `<tr><th class="p-2 text-left">পণ্য</th><th class="p-2 text-right">পিস</th>${showTp() ? '<th class="p-2 text-right">TP</th>' : ''}<th class="p-2 text-right">MRP</th><th class="p-2 text-right">বিক্রয় দাম</th>${showTp() ? '<th class="p-2 text-right">TP মোট</th>' : ''}<th class="p-2 text-right">MRP মোট</th><th class="p-2 text-right">বিক্রয় মোট</th></tr>`;
      $('tbody').innerHTML = view.map(p => `<tr class="${p.qty <= 0 ? 'text-gray-400' : ''}">
        <td class="p-2"><b>${esc(p.name)}</b><br><span class="text-[10px] text-gray-400">${esc(p.sku)} ${esc(p.category)}</span></td>
        <td class="p-2 text-right font-bold ${p.qty < 0 ? 'text-rose-600' : ''}">${p.qty}</td>
        ${showTp() ? `<td class="p-2 text-right">${money(p.tp)}</td>` : ''}
        <td class="p-2 text-right">${money(p.mrp)}</td><td class="p-2 text-right">${money(p.price)}</td>
        ${showTp() ? `<td class="p-2 text-right">${money(p.vTp)}</td>` : ''}
        <td class="p-2 text-right">${money(p.vMrp)}</td><td class="p-2 text-right font-bold">${money(p.vPrice)}</td></tr>`).join('')
        || '<tr><td colspan="8" class="p-6 text-center text-gray-400">কিছু নেই</td></tr>';
    }

    $('csv').onclick = () => {
      const head = ['Name', 'SKU', 'Category', 'Qty', ...(showTp() ? ['TP'] : []), 'MRP', 'SellPrice', ...(showTp() ? ['TP Total'] : []), 'MRP Total', 'Sell Total'];
      const lines = view.map(p => [p.name, p.sku, p.category, p.qty, ...(showTp() ? [p.tp] : []), p.mrp, p.price, ...(showTp() ? [p.vTp] : []), p.vMrp, p.vPrice]
        .map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(','));
      const blob = new Blob(['\ufeff' + [head.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stock-value-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    };
    ['q', 'cat', 'sup', 'only', 'sort'].forEach(id => $(id).addEventListener('input', compute));

    onAuthStateChanged(auth, async (u) => {
      if (!u) { $('msg').textContent = 'প্রথমে অ্যাডমিন প্যানেলে লগইন করুন।'; return; }
      const s = await getDoc(doc(db, 'admins', u.uid));
      if (!s.exists() || s.data().active === false || !['master', 'store'].includes(s.data().role || 'master')) { $('msg').textContent = 'অনুমতি নেই।'; return; }
      role = s.data().role || 'master';
      const snap = await getDocs(collection(db, 'products'));
      all = snap.docs.map(d => { const x = d.data(); const qty = Number(x.stock || 0), tp = Number(x.tp || 0), mrp = Number(x.mrp || 0), price = Number(x.discountPrice || x.price || x.mrp || 0);
        return { id: d.id, name: String(x.name || d.id), sku: x.sku || '', category: x.category || '', supplier: x.supplier || x.vendor || '', qty, tp, mrp, price, vTp: qty * tp, vMrp: qty * mrp, vPrice: qty * price }; });
      const fill = (id, key) => { [...new Set(all.map(p => p[key]).filter(Boolean))].sort().forEach(v => $(id).insertAdjacentHTML('beforeend', `<option>${esc(v)}</option>`)); };
      fill('cat', 'category'); fill('sup', 'supplier');
      $('msg').classList.add('hidden'); $('cards').classList.remove('hidden'); $('tools').classList.remove('hidden');
      compute();
    });
  </script>
  <script type="module" src="admin-nav.js"></script>
</body>
</html>
