<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laland Express – Delivery</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px system-ui,sans-serif;background:#f3f4f6;color:#1f2937;padding-bottom:30px}
header{background:#6d28d9;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:640px;margin:auto}
.c{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e5e7eb}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #d1d5db;width:100%;margin:3px 0}
button{background:#6d28d9;color:#fff;border:0;font-weight:700;cursor:pointer}
button.g{background:#059669}button.r{background:#dc2626}button.s{background:#e5e7eb;color:#374151}
.row{display:flex;gap:6px}.row>*{flex:1}.sp{display:flex;justify-content:space-between;align-items:center;gap:6px}
.t{display:flex;gap:6px;margin-bottom:10px}.t button{background:#e5e7eb;color:#374151}.t button.on{background:#6d28d9;color:#fff}
.b{display:inline-block;padding:2px 8px;border-radius:99px;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:700}
.m{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.m>div{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:380px}
#offer{background:#065f46;color:#fff;text-align:center;z-index:30}#offer>div{background:none}
#offer .ph{font-size:44px;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.2)}}
small{color:#6b7280}
</style></head><body>
<header id="hd" hidden><b id="who"></b><button class="s" style="width:auto" onclick="logout()">লগআউট</button></header>
<main>
<section id="login" class="c"><h3>Laland Express লগইন</h3>
<form id="lf"><input id="u" placeholder="রাইডার: মোবাইল নম্বর | অ্যাডমিন: ইমেইল" required>
<input id="p" type="password" placeholder="পাসওয়ার্ড" required><button>লগইন</button></form></section>

<section id="rider" hidden>
<div class="row"><div class="c">ক্যাশ জমা বাকি<h3 id="cash">৳0</h3></div><div class="c">আয় (কমিশন)<h3 id="earn">৳0</h3></div></div>
<button class="g" onclick="openStl()">ক্যাশ জমা দিন</button>
<div class="t" style="margin-top:10px"><button id="rt-act" class="on" onclick="rTab('act')">চলমান</button><button id="rt-done" onclick="rTab('done')">সম্পন্ন</button><button id="rt-h" onclick="rTab('h')">জমার ইতিহাস</button></div>
<div id="rlist"></div></section>

<section id="admin" hidden>
<div class="t"><button id="at-o" class="on" onclick="aTab('o')">অর্ডার</button><button id="at-r" onclick="aTab('r')">রাইডার</button><button id="at-s" onclick="aTab('s')">ক্যাশ জমা<span id="pc"></span></button></div>
<div id="aOrders"><select id="of" onchange="renderA()"><option value="un">অ্যাসাইন হয়নি</option><option value="of">অফার পাঠানো</option><option value="ac">চলমান</option><option value="dn">সম্পন্ন</option><option value="cx">বাতিল</option><option value="all">সব</option></select><div id="olist"></div></div>
<div id="aStl" hidden><b>অপেক্ষমাণ অনুরোধ</b><div id="stP"></div><div class="c"><b>হিস্ট্রি</b><div class="row"><input id="hm" type="month" onchange="renderS()"><select id="hs" onchange="renderS()"><option value="ALL">সব</option><option value="Approved">অনুমোদিত</option><option value="Rejected">বাতিল</option></select></div><input id="hq" placeholder="রাইডারের নাম/নম্বর" oninput="renderS()"><button class="g" onclick="expS()">এক্সেল (CSV)</button></div><div id="stH"></div></div>
<div id="aRiders" hidden>
<div class="c"><b>নতুন রাইডার</b><input id="rn" placeholder="নাম"><input id="rp" placeholder="মোবাইল (01XXXXXXXXX)"><input id="rw" type="password" placeholder="পাসওয়ার্ড (৬+)"><input id="ra" placeholder="এলাকা"><input id="rv" placeholder="বাহন (বাইক/সাইকেল)">
<div class="row"><input id="rs" type="number" placeholder="বেতন"><input id="rc" type="number" placeholder="কমিশন/ডেলিভারি" value="30"></div><button onclick="addRider()">রাইডার তৈরি করুন</button></div>
<div id="rlistA"></div></div></section>
</main>

<div id="offer" class="m" hidden><div><div class="ph">📞</div><h2>নতুন ডেলিভারি অফার</h2><div id="offT"></div><h1 id="cd">60</h1>
<button class="g" style="font-size:18px;padding:14px" onclick="respond(true)">✅ রিসিভ করুন</button><button class="r" onclick="respond(false)">❌ বাতিল</button></div></div>
<div id="pay" class="m" hidden><div><h3>ডেলিভারি সম্পন্ন</h3><p id="payAmt"></p><select id="pm"><option>Cash</option><option>bKash</option><option>Nagad</option></select><input id="trx" placeholder="Trx ID (অনলাইন হলে)"><button class="g" onclick="donePay()">নিশ্চিত করুন</button><button class="s" onclick="pay.hidden=true">বন্ধ</button></div></div>
<div id="stl" class="m" hidden><div><h3>ক্যাশ জমা</h3><input id="sa" type="number" placeholder="পরিমাণ"><select id="sm"><option>Cash</option><option>bKash</option><option>Nagad</option></select><input id="sr" placeholder="Trx/নোট"><button class="g" onclick="sendStl()">জমা পাঠান</button><button class="s" onclick="stl.hidden=true">বন্ধ</button></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,increment,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U",authDomain:"laland-express.firebaseapp.com",projectId:"laland-express",storageBucket:"laland-express.firebasestorage.app",messagingSenderId:"315462688826",appId:"1:315462688826:web:a6b033e1ce664071201503"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIN=['Delivered','Completed','Cancelled'];
let me,orders=[],riders=[],stls=[],allS=[],busyF=0,unsub=[],rt='act',offerId,cdT,ringT,ctx,payId;
const iso=()=>new Date().toISOString();

// ---- sound/vibration
document.addEventListener('click',()=>{const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A();ctx.resume()});
function beep(){if(ctx){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.4)}navigator.vibrate&&navigator.vibrate([400,200,400])}
const startRing=()=>{stopRing();beep();ringT=setInterval(beep,1500)},stopRing=()=>{clearInterval(ringT);navigator.vibrate&&navigator.vibrate(0)};

// ---- auth + role routing
$('lf').onsubmit=async e=>{e.preventDefault();const v=$('u').value.trim(),em=v.includes('@')?v:v.replace(/\D/g,'')+'@lalandrider.com';
try{await signInWithEmailAndPassword(auth,em,$('p').value)}catch(x){alert('নম্বর/ইমেইল বা পাসওয়ার্ড ভুল')}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
unsub.forEach(f=>f());unsub=[];hideOffer();['login','rider','admin'].forEach(i=>$(i).hidden=true);$('hd').hidden=!u;
if(!u){$('login').hidden=false;return}
try{if((await getDoc(doc(db,'admins',u.uid))).exists())startAdmin();
else{const s=await getDoc(doc(db,'riders',u.uid));if(!s.exists())throw 0;me={id:s.id,...s.data()};if(me.status=='Inactive')throw 0;startRider()}}
catch(x){alert('এই অ্যাকাউন্টের অনুমতি নেই');signOut(auth)}});
const snap=(q,f)=>unsub.push(onSnapshot(q,f,e=>console.error(e)));
const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));

// ================= RIDER =================
function startRider(){$('rider').hidden=false;$('who').textContent='🏍 '+me.name;
snap(doc(db,'riders',me.id),s=>{me={id:s.id,...s.data()};$('cash').textContent='৳'+(me.cashBalance||0);$('earn').textContent='৳'+(me.earningsBalance||0)});
snap(query(collection(db,'orders'),where('riderPhone','==',me.phone)),s=>{orders=list(s);renderR();checkOffer()});
snap(query(collection(db,'cash_settlements'),where('riderPhone','==',me.phone)),s=>{stls=list(s).sort((a,b)=>(b.createdAt||'')<(a.createdAt||'')?-1:1);renderR()})}
window.rTab=t=>{rt=t;['act','done','h'].forEach(x=>$('rt-'+x).className=x==t?'on':'');renderR()};
function renderR(){const c=$('rlist');
if(rt=='h'){c.innerHTML=stls.map(s=>`<div class="c sp"><span><b>৳${s.amount}</b> <small>${E(s.method)} ${E(s.trxRef)}</small></span><span class="b">${s.status=='Approved'?'অনুমোদিত':s.status=='Rejected'?'বাতিল':'অপেক্ষায়'}</span></div>`).join('')||'<small>কিছু নেই</small>';return}
const l=orders.filter(o=>o.status!='Offered'&&(rt=='act'?!FIN.includes(o.status):o.status=='Delivered'||o.status=='Completed'));
c.innerHTML=l.map(o=>`<div class="c"><div class="sp"><b>${E(o.orderId||o.id)}</b><span class="b">${E(o.status)}</span></div>
<div>👤 ${E(o.userName)} · <a href="tel:${E(o.userPhone)}">📞 ${E(o.userPhone)}</a></div>
<div><a href="https://maps.google.com/?q=${encodeURIComponent(o.address||'')}" target="_blank">📍 ${E(o.address)}</a></div>
<small>${(o.items||[]).map(i=>E(i.name)+' ×'+(i.qty||1)).join(', ')}</small>
<div class="sp"><b>৳${o.totalAmount||0}</b>${rt=='act'?`<button class="g" style="width:auto" onclick="openPay('${o.id}')">ডেলিভারি হয়েছে</button>`:`<span>${E(o.paymentMethod)}</span>`}</div></div>`).join('')||'<small>কোনো অর্ডার নেই</small>'}

function checkOffer(){const o=orders.find(x=>x.status=='Offered');if(!o){hideOffer();return}
if(offerId==o.id)return;offerId=o.id;
$('offT').innerHTML=`<p><b>${E(o.orderId||o.id)}</b> · ৳${o.totalAmount||0}</p><p>📍 ${E(o.address)}</p><p>👤 ${E(o.userName)}</p>`;
$('offer').hidden=false;startRing();let t=60;$('cd').textContent=t;clearInterval(cdT);
cdT=setInterval(()=>{$('cd').textContent=--t;if(t<=0)respond(false)},1000)}
function hideOffer(){offerId=null;$('offer').hidden=true;stopRing();clearInterval(cdT)}
window.respond=async ok=>{const id=offerId;hideOffer();if(!id)return;
try{await updateDoc(doc(db,'orders',id),ok?{status:'Out for Delivery',acceptedAt:iso()}:{status:'Pending',riderPhone:'',riderId:'',riderName:'',offeredAt:''})}catch(e){alert(e.message)}};

window.openPay=id=>{payId=id;$('payAmt').textContent='৳'+orders.find(o=>o.id==id).totalAmount;$('pay').hidden=false};
window.donePay=async()=>{if(busyF)return;const o=orders.find(x=>x.id==payId);if(!o||o.status=='Delivered')return;const m=$('pm').value,amt=Number(o.totalAmount||0),com=Number(me.deliveryCommission||30);busyF=1;
try{const b=writeBatch(db);b.update(doc(db,'orders',payId),{status:'Delivered',paymentMethod:m,paymentTrxId:$('trx').value.trim(),deliveredAt:iso()});b.update(doc(db,'riders',me.id),{...(m=='Cash'?{cashBalance:increment(amt)}:{}),earningsBalance:increment(com)});await b.commit();$('pay').hidden=true;$('trx').value='';alert('সম্পন্ন! কমিশন ৳'+com)}catch(e){alert('ব্যর্থ: '+e.message)}busyF=0};

window.openStl=()=>{const c=Number(me.cashBalance||0);$('sa').value=c>0?c:'';$('stl').hidden=false};
window.sendStl=async()=>{const a=Number($('sa').value),c=Number(me.cashBalance||0);
if(!a||a<=0||a>c)return alert('সঠিক পরিমাণ দিন (সর্বোচ্চ ৳'+c+')');
if(stls.some(s=>s.status=='Pending'))return alert('আগের অনুরোধ এখনো অপেক্ষায় আছে');
if(busyF)return;busyF=1;setTimeout(()=>busyF=0,3000);
try{await addDoc(collection(db,'cash_settlements'),{riderId:me.id,riderName:me.name,riderPhone:me.phone,amount:a,method:$('sm').value,trxRef:$('sr').value.trim(),status:'Pending',createdAt:iso()});$('stl').hidden=true;alert('অনুরোধ পাঠানো হয়েছে')}catch(e){alert(e.message)}};

// ================= ADMIN =================
function startAdmin(){$('admin').hidden=false;$('who').textContent='👑 অ্যাডমিন';
snap(collection(db,'orders'),s=>{orders=list(s).sort((a,b)=>(b.createdAt||'')<(a.createdAt||'')?-1:1);renderA()});
snap(collection(db,'riders'),s=>{riders=list(s);renderA()});
snap(collection(db,'cash_settlements'),s=>{allS=list(s).sort((a,b)=>(b.createdAt||'')<(a.createdAt||'')?-1:1);renderS()})}
window.aTab=t=>{['o','r','s'].forEach(x=>{$({o:'aOrders',r:'aRiders',s:'aStl'}[x]).hidden=x!=t;$('at-'+x).className=x==t?'on':''})};
const busy=r=>orders.filter(o=>o.riderPhone==r.phone&&!FIN.includes(o.status)).length;
window.renderA=()=>{const f=$('of').value,keep={};document.querySelectorAll('#olist select').forEach(x=>keep[x.id]=x.value);
const l=orders.filter(o=>f=='all'||(f=='un'&&!o.riderPhone&&!FIN.includes(o.status))||(f=='of'&&o.status=='Offered')||(f=='ac'&&o.riderPhone&&o.status!='Offered'&&!FIN.includes(o.status))||(f=='dn'&&['Delivered','Completed'].includes(o.status))||(f=='cx'&&o.status=='Cancelled')).slice(0,60);
$('olist').innerHTML=l.map(o=>`<div class="c"><div class="sp"><b>${E(o.orderId||o.id)}</b><span class="b">${E(o.status)}</span></div>
<div>👤 ${E(o.userName)} · ${E(o.userPhone)}</div><div>📍 ${E(o.address)}</div><div class="sp"><b>৳${o.totalAmount||0}</b><small>${o.riderName?'🏍 '+E(o.riderName):''}</small></div>
${detailsHtml(o)}
${FIN.includes(o.status)?'':`<div class="row"><select id="s_${o.id}">${riders.filter(r=>r.status!='Inactive').map(r=>`<option value="${r.id}" ${r.id==o.riderId?'selected':''}>${E(r.name)} (${busy(r)?'ব্যস্ত '+busy(r):'ফ্রি'})</option>`).join('')}</select><button style="flex:0 0 90px" onclick="assign('${o.id}')">অ্যাসাইন</button><button class="r" style="flex:0 0 70px" onclick="cancelO('${o.id}')">বাতিল</button></div>`}</div>`).join('')||'<small>কোনো অর্ডার নেই</small>';
Object.entries(keep).forEach(([k,v])=>{const e=$(k);if(e)e.value=v});
$('rlistA').innerHTML=riders.map(r=>`<div class="c"><div class="sp"><b>${E(r.name)}</b><span class="b">${r.status=='Inactive'?'নিষ্ক্রিয়':busy(r)?'ব্যস্ত ('+busy(r)+')':'ফ্রি'}</span></div>
<small>${E(r.phone)} · ${E(r.area)} · ${E(r.vehicle)}</small><div>ক্যাশ বাকি ৳${r.cashBalance||0} · আয় ৳${r.earningsBalance||0}</div><small>বেতন ৳${r.fixedSalary||0} · কমিশন ৳${r.deliveryCommission||0}</small>
<div class="row"><button class="s" onclick="editR('${r.id}')">এডিট</button><button class="${r.status=='Inactive'?'g':'r'}" onclick="toggleR('${r.id}')">${r.status=='Inactive'?'সক্রিয় করুন':'নিষ্ক্রিয় করুন'}</button></div></div>`).join('')};
window.assign=async id=>{const r=riders.find(x=>x.id==$('s_'+id).value);if(!r)return;
try{await updateDoc(doc(db,'orders',id),{status:'Offered',riderId:r.id,riderPhone:r.phone,riderName:r.name,offeredAt:iso()})}catch(e){alert(e.message)}};
window.addRider=async()=>{const n=$('rn').value.trim(),w=$('rw').value;let p=$('rp').value.replace(/\D/g,'');if(p.startsWith('880'))p=p.slice(2);if(p.length==10&&p[0]=='1')p='0'+p;
if(!n||!/^01[3-9]\d{8}$/.test(p)||w.length<6)return alert('নাম, সঠিক নম্বর (01XXXXXXXXX) ও ৬+ পাসওয়ার্ড দিন');
if(riders.some(r=>r.phone==p))return alert('এই নম্বরে রাইডার আছে');
const sa=getAuth(initializeApp(cfg,'sec'+Date.now())),em=p+'@lalandrider.com';
try{const u=await createUserWithEmailAndPassword(sa,em,w);
await setDoc(doc(db,'riders',u.user.uid),{uid:u.user.uid,name:n,phone:p,email:em,area:$('ra').value.trim(),vehicle:$('rv').value.trim(),fixedSalary:Number($('rs').value)||0,deliveryCommission:Number($('rc').value)||30,cashBalance:0,earningsBalance:0,status:'Active',createdAt:iso()});
await signOut(sa);['rn','rp','rw','ra','rv','rs'].forEach(i=>$(i).value='');alert('রাইডার তৈরি হয়েছে')}catch(e){alert(e.message)}};
window.editR=async id=>{const r=riders.find(x=>x.id==id),c=prompt('কমিশন/ডেলিভারি',r.deliveryCommission),s=prompt('মাসিক বেতন',r.fixedSalary);
if(c===null||s===null)return;try{await updateDoc(doc(db,'riders',id),{deliveryCommission:Number(c)||0,fixedSalary:Number(s)||0})}catch(e){alert(e.message)}};
window.toggleR=async id=>{const r=riders.find(x=>x.id==id),n=r.status=='Inactive'?'Active':'Inactive';if(confirm((n=='Inactive'?'নিষ্ক্রিয়':'সক্রিয়')+' করবেন? '+r.name))try{await updateDoc(doc(db,'riders',id),{status:n})}catch(e){alert(e.message)}};

// ---- ক্যাশ জমা (অ্যাডমিন)
const fmtD=d=>d?new Date(d).toLocaleString():'';
const hist=()=>{const m=$('hm').value,st=$('hs').value,q=$('hq').value.trim().toLowerCase();return allS.filter(s=>s.status!='Pending'&&(!m||(s.createdAt||'').startsWith(m))&&(st=='ALL'||s.status==st)&&(!q||((s.riderName||'')+(s.riderPhone||'')).toLowerCase().includes(q)))};
window.renderS=()=>{const P=allS.filter(s=>s.status=='Pending');$('pc').textContent=P.length?' ('+P.length+')':'';
$('stP').innerHTML=P.map(s=>`<div class="c"><div class="sp"><b>${E(s.riderName)}</b><span class="b">${E(s.method)}</span></div><small>${E(s.riderPhone)} · ${E(s.trxRef)||'N/A'} · ${fmtD(s.createdAt)}</small><div><b>৳${Number(s.amount)||0}</b></div><div class="row"><button class="g" onclick="apvS('${s.id}')">অনুমোদন</button><button class="r" onclick="rejS('${s.id}')">বাতিল</button></div></div>`).join('')||'<small>কোনো অপেক্ষমাণ অনুরোধ নেই</small>';
$('stH').innerHTML=hist().map(s=>`<div class="c sp"><span><b>${E(s.riderName)}</b> <small>${E(s.method)} · ${E(s.trxRef)} · ${fmtD(s.approvedAt||s.rejectedAt||s.createdAt)}</small></span><span><b>৳${Number(s.amount)||0}</b> <span class="b">${s.status=='Approved'?'অনুমোদিত':'বাতিল'}</span></span></div>`).join('')||'<small>কিছু নেই</small>'};
window.apvS=async id=>{if(!confirm('অনুমোদন করবেন? রাইডারের ক্যাশ বাকি থেকে টাকা কাটা হবে।'))return;
try{await runTransaction(db,async tx=>{const sr=doc(db,'cash_settlements',id),s=await tx.get(sr);if(!s.exists()||s.data().status!='Pending')throw new Error('এটি আর অপেক্ষমাণ নেই');
const rr=doc(db,'riders',s.data().riderId),r=await tx.get(rr),a=Number(s.data().amount),c=Number((r.data()||{}).cashBalance||0);
if(!(a>0)||a>c)throw new Error('রাইডারের ক্যাশ বাকি ৳'+c+', অনুরোধ ৳'+a);
tx.update(sr,{status:'Approved',approvedAt:iso()});tx.update(rr,{cashBalance:c-a})});alert('অনুমোদিত')}catch(e){alert(e.message)}};
window.rejS=async id=>{if(!confirm('বাতিল করবেন?'))return;try{await runTransaction(db,async tx=>{const sr=doc(db,'cash_settlements',id),s=await tx.get(sr);if(!s.exists()||s.data().status!='Pending')throw new Error('এটি আর অপেক্ষমাণ নেই');tx.update(sr,{status:'Rejected',rejectedAt:iso()})})}catch(e){alert(e.message)}};
window.expS=()=>{const l=hist();if(!l.length)return alert('ডেটা নেই');
const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const csv='\uFEFFID,Rider,Phone,Amount,Method,Note,Status,Date\r\n'+l.map(s=>[s.id,s.riderName,s.riderPhone,s.amount,s.method,s.trxRef,s.status,s.createdAt].map(q).join(',')).join('\r\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='settlements.csv';a.click()};

// ---- অর্ডার বিস্তারিত ও মেমো প্রিন্ট (অ্যাডমিন)
const N=v=>Number(v)||0,openD=new Set(),tk=v=>'৳'+(Math.round(N(v)*100)/100);
function calc(o){const it=o.items||[],sub=N(o.subtotal)||it.reduce((s,i)=>s+N(i.price)*N(i.qty),0),rows=[['পণ্যের মোট',sub]];let t=sub;
const sav=it.reduce((s,i)=>s+(N(i.mrp)>N(i.price)?(N(i.mrp)-N(i.price))*N(i.qty):0),0);
const ds=Array.isArray(o.discounts)&&o.discounts.length?o.discounts:(N(o.discount)>0?[{label:'কুপন',code:o.couponCode,amount:o.discount}]:[]);
ds.forEach(d=>{rows.push([(d.label||'ছাড়')+(d.code?' ('+d.code+')':''),-N(d.amount)]);t-=N(d.amount)});
const dc=o.deliveryCharge==null?30:N(o.deliveryCharge);rows.push(['ডেলিভারি চার্জ',dc,dc?0:'ফ্রি']);t+=dc;
if(N(o.vat)){rows.push(['ভ্যাট',N(o.vat)]);t+=N(o.vat)}
['walletUsed','pointsUsed'].forEach(k=>{if(N(o[k])){rows.push([k=='walletUsed'?'ওয়ালেট থেকে':'পয়েন্ট থেকে',-N(o[k])]);t-=N(o[k])}});
return{rows,sav,calc:t,stored:N(o.totalAmount)}}
const rowH=r=>`<div class="sp"><span>${E(r[0])}</span><b>${r[2]||(r[1]<0?'−':'')+tk(Math.abs(r[1]))}</b></div>`;
function detailsHtml(o){const c=calc(o),it=o.items||[];
return `<details ${openD.has(o.id)?'open':''} ontoggle="tg('${o.id}',this.open)"><summary style="cursor:pointer;color:#6d28d9;font-weight:700;padding:6px 0">📦 পণ্যের বিস্তারিত (${it.length}টি)</summary>
${it.map(i=>`<div class="sp" style="border-bottom:1px dashed #e5e7eb;padding:3px 0"><span>${E(i.name)}<br><small>${tk(i.price)} × ${N(i.qty)}</small></span><b>${tk(N(i.price)*N(i.qty))}</b></div>`).join('')||'<small>কোনো পণ্য নেই</small>'}
<div style="margin-top:6px">${c.rows.map(rowH).join('')}<div class="sp" style="border-top:1px solid #d1d5db;margin-top:4px;padding-top:4px"><b>সর্বমোট</b><b>${tk(c.stored)}</b></div></div>
${c.sav?`<small>🎉 পণ্যে সাশ্রয়: ${tk(c.sav)}</small><br>`:''}${Math.abs(c.calc-c.stored)>.5?`<small style="color:#dc2626">⚠ হিসাব মেলেনি (গণনা ${tk(c.calc)}, সেভ করা ${tk(c.stored)})</small><br>`:''}
${o.note?`<small>📝 ${E(o.note)}</small><br>`:''}<button class="s" onclick="printMemo('${o.id}')">🖨 মেমো প্রিন্ট</button></details>`}
window.tg=(id,v)=>{v?openD.add(id):openD.delete(id)};
window.cancelO=async id=>{if(confirm('অর্ডার বাতিল করবেন?'))try{await updateDoc(doc(db,'orders',id),{status:'Cancelled',cancelledAt:iso()})}catch(e){alert(e.message)}};
window.printMemo=id=>{const o=orders.find(x=>x.id==id);if(!o)return;const c=calc(o),it=o.items||[],w=window.open('','_blank');if(!w)return alert('পপআপ ব্লক করা আছে, অনুমতি দিন');
w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${E(o.orderId||o.id)}</title><style>@page{size:80mm auto;margin:4mm}body{font:12px Arial,sans-serif;width:72mm;margin:0 auto;color:#000}h3,p{margin:2px 0;text-align:center}table{width:100%;border-collapse:collapse;margin:6px 0}td,th{padding:3px 0;border-bottom:1px dashed #999;text-align:left;vertical-align:top}.r{text-align:right}.s{display:flex;justify-content:space-between}.b{border-top:2px solid #000;margin-top:4px;padding-top:4px;font-weight:700;font-size:14px}.n{border:1px solid #000;padding:4px;margin-top:6px;text-align:center;font-weight:700}@media print{button{display:none}}</style></head><body>
<h3>Laland Express</h3><p>ডেলিভারি মেমো</p><p><b>${E(o.orderId||o.id)}</b></p><p>${o.createdAt?E(new Date(o.createdAt).toLocaleString()):''}</p><hr>
<p style="text-align:left"><b>গ্রাহক:</b> ${E(o.userName)}<br><b>মোবাইল:</b> ${E(o.userPhone)}<br><b>ঠিকানা:</b> ${E(o.address)}${o.note?'<br><b>নোট:</b> '+E(o.note):''}${o.riderName?'<br><b>রাইডার:</b> '+E(o.riderName):''}</p>
<table><tr><th>পণ্য</th><th class="r">পরিমাণ</th><th class="r">টাকা</th></tr>${it.map(i=>`<tr><td>${E(i.name)}<br>${tk(i.price)}</td><td class="r">${N(i.qty)}</td><td class="r">${tk(N(i.price)*N(i.qty))}</td></tr>`).join('')}</table>
${c.rows.map(r=>`<div class="s"><span>${E(r[0])}</span><span>${r[2]||(r[1]<0?'−':'')+tk(Math.abs(r[1]))}</span></div>`).join('')}
<div class="s b"><span>সর্বমোট</span><span>${tk(c.stored)}</span></div><div class="n">গ্রাহকের কাছ থেকে নিতে হবে: ${tk(c.stored)}</div>
<p style="margin-top:8px">☐ পণ্য বুঝে নিয়েছি (রাইডারের স্বাক্ষর): ________</p><p>ধন্যবাদ!</p><button onclick="print()" style="width:100%;padding:10px;margin-top:8px">🖨 প্রিন্ট</button></body></html>`);
w.document.close();setTimeout(()=>w.print(),400)};
</script></body></html>
