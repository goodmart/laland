<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laland Express – Delivery</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px system-ui,sans-serif;background:#f3f4f6;color:#1f2937;padding-bottom:30px}
header{background:#6d28d9;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:640px;margin:auto}
.c{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e5e7eb}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #d1d5db;width:100%;margin:3px 0}
button{background:#6d28d9;color:#fff;border:0;font-weight:700;cursor:pointer}
button.g{background:#059669}button.r{background:#dc2626}button.s{background:#e5e7eb;color:#374151}
.row{display:flex;gap:6px}.row>*{flex:1}.sp{display:flex;justify-content:space-between;align-items:center;gap:6px}
.t{display:flex;gap:6px;margin-bottom:10px}.t button{background:#e5e7eb;color:#374151}.t button.on{background:#6d28d9;color:#fff}
.b{display:inline-block;padding:2px 8px;border-radius:99px;background:#ede9fe;color:#5b21b6;font-size:11px;font-weight:700}
.m{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.m>div{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:380px}
#offer{background:#065f46;color:#fff;text-align:center;z-index:30}#offer>div{background:none}
#offer .ph{font-size:44px;animation:p 1s infinite}@keyframes p{50%{transform:scale(1.2)}}
small{color:#6b7280}
.t button{padding:9px 4px;font-size:12px}label{display:block;margin-top:4px}.m>div{max-height:92vh;overflow:auto}</style><script>function __eb(m){var d=document.getElementById('eb');if(!d){d=document.createElement('div');d.id='eb';d.style.cssText='background:#dc2626;color:#fff;padding:8px;font:12px monospace;white-space:pre-wrap';document.body.insertBefore(d,document.body.firstChild)}d.textContent+=m+'\n'}
addEventListener('error',function(e){__eb((e.message||'error')+' @'+String(e.filename||'').split('/').pop()+':'+e.lineno)});addEventListener('unhandledrejection',function(e){__eb('Promise: '+(e.reason&&e.reason.message||e.reason))})</script></head><body>
<header id="hd" hidden><b id="who"></b><button class="s" style="width:auto" onclick="logout()">লগআউট</button></header>
<main>
<section id="login" class="c"><h3>Laland Express লগইন</h3>
<form id="lf"><input id="u" placeholder="রাইডার: মোবাইল নম্বর | অ্যাডমিন: ইমেইল" required>
<input id="p" type="password" placeholder="পাসওয়ার্ড" required><button>লগইন</button></form></section>

<section id="rider" hidden>
<div class="row"><div class="c">ক্যাশ জমা বাকি<h3 id="cash">৳0</h3></div><div class="c">আয় (কমিশন)<h3 id="earn">৳0</h3></div></div>
<button class="g" onclick="openStl()">ক্যাশ জমা দিন</button>
<div class="t" style="margin-top:10px"><button id="rt-act" class="on" onclick="rTab('act')">চলমান</button><button id="rt-done" onclick="rTab('done')">সম্পন্ন</button><button id="rt-h" onclick="rTab('h')">জমার ইতিহাস</button><button id="rt-p" onclick="rTab('p')">প্রোফাইল</button></div>
<div id="dF" class="c" hidden><div class="row"><input id="dm" type="month" onchange="dmC()"><input id="dd" type="date" onchange="ddC()"></div><select id="ds" onchange="renderR()"></select><button class="g" onclick="expD()">📥 এক্সেল এক্সপোর্ট</button></div>
<div id="hF" class="c" hidden><div class="row"><input id="hm2" type="month" onchange="renderR()"><select id="hs2" onchange="renderR()"></select></div><button class="g" onclick="expH()">📥 এক্সেল এক্সপোর্ট</button></div>
<div id="rlist"></div></section>

<section id="admin" hidden>
<div class="t"><button id="at-o" class="on" onclick="aTab('o')">অর্ডার</button><button id="at-r" onclick="aTab('r')">রাইডার</button><button id="at-s" onclick="aTab('s')">ক্যাশ জমা<span id="pc"></span></button></div>
<div id="aOrders"><select id="of" onchange="renderA()"><option value="pn">Pending</option><option value="pr">Processing</option><option value="ow">On the Way</option><option value="dn">Delivered</option><option value="cx">Cancelled</option><option value="rt">Returned</option><option value="ALL">সব</option></select><div id="olist"></div></div>
<div id="aStl" hidden><b>অপেক্ষমাণ অনুরোধ</b><div id="stP"></div><div class="c"><b>হিস্ট্রি</b><div class="row"><input id="hm" type="month" onchange="renderS()"><select id="hs" onchange="renderS()"><option value="ALL">সব</option><option value="Approved">অনুমোদিত</option><option value="Rejected">বাতিল</option></select></div><input id="hq" placeholder="রাইডারের নাম/নম্বর/ইনভয়েস" oninput="renderS()"><button class="g" onclick="expS()">📥 এক্সেল এক্সপোর্ট</button></div><div id="stH"></div></div>
<div id="aRiders" hidden>
<div class="c"><b>নতুন রাইডার</b><input id="rn" placeholder="নাম"><input id="rp" placeholder="মোবাইল (01XXXXXXXXX)"><input id="rw" type="password" placeholder="পাসওয়ার্ড (৬+)"><input id="ra" placeholder="এলাকা"><input id="rv" placeholder="বাহন (বাইক/সাইকেল)">
<div class="row"><input id="rs" type="number" placeholder="বেতন"><input id="rc" type="number" placeholder="কমিশন/ডেলিভারি" value="30"></div><button onclick="addRider()">রাইডার তৈরি করুন</button></div>
<div id="rlistA"></div></div></section>
</main>

<div id="offer" class="m" hidden><div><div class="ph">📞</div><h2>নতুন ডেলিভারি অফার</h2><div id="offT"></div><h1 id="cd">60</h1>
<button class="g" style="font-size:18px;padding:14px" onclick="respond(true)">✅ রিসিভ করুন</button><button class="r" onclick="respond(false)">❌ বাতিল</button></div></div>
<div id="pay" class="m" hidden><div><h3>ডেলিভারি সম্পন্ন</h3><p id="payAmt"></p><select id="pm"><option>Cash</option><option>bKash</option><option>Nagad</option></select><input id="trx" placeholder="Trx ID (অনলাইন হলে)"><button class="g" onclick="donePay()">নিশ্চিত করুন</button><button class="s" onclick="pay.hidden=true">বন্ধ</button></div></div>
<div id="stl" class="m" hidden><div><h3>ক্যাশ জমা (ইনভয়েস অনুযায়ী)</h3><small id="sCb"></small><div id="sl"></div><div class="sp" style="margin-top:6px"><b>মোট জমা</b><b id="sT">৳0</b></div><select id="sm"><option>Cash</option><option>bKash</option><option>Nagad</option></select><input id="sr" placeholder="Trx ID/নোট"><button class="g" onclick="sendStl()">জমা পাঠান</button><button class="s" onclick="stl.hidden=true">বন্ধ</button></div></div>
<div id="rpm" class="m" hidden><div style="max-width:460px"><div id="rpB"></div><button class="s" onclick="rpm.hidden=true">বন্ধ</button></div></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,increment,runTransaction,writeBatch} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
const cfg={apiKey:"AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U",authDomain:"laland-express.firebaseapp.com",projectId:"laland-express",storageBucket:"laland-express.firebasestorage.app",messagingSenderId:"315462688826",appId:"1:315462688826:web:a6b033e1ce664071201503"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIN=['Delivered','Completed','Cancelled','Returned'];
let me,orders=[],riders=[],stls=[],allS=[],busyF=0,unsub=[],rt='act',offerId,cdT,ringT,ctx,payId,isAd=false;
const iso=()=>new Date().toISOString();

// ---- shared helpers
const pad=n=>String(n).padStart(2,'0'),ld=d=>{const x=d?new Date(d):0;return x&&!isNaN(x)?x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()):''};
const fdt=d=>d?new Date(d).toLocaleString():'';
const grp=o=>o.status=='Completed'?'Delivered':o.status;
const od=o=>(o.status=='Cancelled'?o.cancelledAt:o.status=='Returned'?o.returnedAt:o.deliveredAt)||o.createdAt;
const invNo=s=>(s.invoices||[]).map(i=>i.no).join(', ');
const cn=(a,s)=>a.filter(x=>x.status==s).length,cg=(a,s)=>a.filter(x=>grp(x)==s).length;
const stT=s=>s=='Approved'?'অনুমোদিত':s=='Rejected'?'বাতিল':'অপেক্ষায়';
const fill=(id,items)=>{const el=$(id),c=el.value||'ALL';el.innerHTML=items.map(([v,l,n])=>`<option value="${v}">${l} (${n})</option>`).join('');el.value=c};
// পুরনো জমা-হয়ে-যাওয়া ডেলিভারি unpaid তালিকায় না আনতে এখানে তারিখ দিন, যেমন '2026-11-05'
const INV_FROM='';
function xl(name,head,rows){if(!rows.length)return alert('ডেটা নেই');const go=()=>{
if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map(h=>({wch:Math.max(14,String(h).length+4)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data');XLSX.writeFile(wb,name+'.xlsx');return}
const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click()};
if(window.XLSX)return go();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=go;sc.onerror=go;document.head.appendChild(sc)}


// ---- sound/vibration
document.addEventListener('click',()=>{const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A();ctx.resume()});
function beep(){if(ctx){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.4)}navigator.vibrate&&navigator.vibrate([400,200,400])}
const startRing=()=>{stopRing();beep();ringT=setInterval(beep,1500)},stopRing=()=>{clearInterval(ringT);navigator.vibrate&&navigator.vibrate(0)};

// ---- auth + role routing
$('lf').onsubmit=async e=>{e.preventDefault();const v=$('u').value.trim(),em=v.includes('@')?v:v.replace(/\D/g,'')+'@lalandrider.com';
try{await signInWithEmailAndPassword(auth,em,$('p').value)}catch(x){alert('নম্বর/ইমেইল বা পাসওয়ার্ড ভুল')}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
unsub.forEach(f=>f());unsub=[];hideOffer();['login','rider','admin'].forEach(i=>$(i).hidden=true);$('hd').hidden=!u;
if(!u){$('login').hidden=false;return}
try{if((await getDoc(doc(db,'admins',u.uid))).exists())startAdmin();
else{const s=await getDoc(doc(db,'riders',u.uid));if(!s.exists())throw 0;me={id:s.id,...s.data()};if(me.status=='Inactive')throw 0;startRider()}}
catch(x){alert('এই অ্যাকাউন্টের অনুমতি নেই');signOut(auth)}});
const snap=(q,f)=>unsub.push(onSnapshot(q,f,e=>console.error(e)));
const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));

// ================= RIDER =================
function startRider(){isAd=false;$('rider').hidden=false;$('who').textContent='🏍 '+me.name;
snap(doc(db,'riders',me.id),s=>{me={id:s.id,...s.data()};$('cash').textContent='৳'+(me.cashBalance||0);$('earn').textContent='৳'+(me.earningsBalance||0);renderR()});
snap(query(collection(db,'orders'),where('riderPhone','==',me.phone)),s=>{orders=list(s);renderR();checkOffer()});
snap(query(collection(db,'cash_settlements'),where('riderPhone','==',me.phone)),s=>{stls=list(s).sort((a,b)=>(b.createdAt||'')<(a.createdAt||'')?-1:1);renderR()})}
window.rTab=t=>{rt=t;['act','done','h','p'].forEach(x=>$('rt-'+x).className=x==t?'on':'');renderR()};
window.dmC=()=>{$('dd').value='';renderR()};window.ddC=()=>{$('dm').value='';renderR()};
const dBase=()=>{const m=$('dm').value,d=$('dd').value;return orders.filter(o=>['Delivered','Completed','Returned','Cancelled'].includes(o.status)&&(!m||ld(od(o)).startsWith(m))&&(!d||ld(od(o))==d)).sort((a,b)=>od(b)>od(a)?1:-1)};
const dList=()=>{const B=dBase(),c=$('ds').value||'ALL';return c=='ALL'?B:B.filter(o=>grp(o)==c)};
const hBase=()=>{const m=$('hm2').value;return stls.filter(s=>!m||ld(s.createdAt).startsWith(m))};
const hList=()=>{const B=hBase(),c=$('hs2').value||'ALL';return c=='ALL'?B:B.filter(s=>s.status==c)};
const rCard=(o,act)=>`<div class="c"><div class="sp"><b>${E(o.orderId||o.id)}</b><span class="b">${E(o.status)}</span></div>
<div>👤 ${E(o.userName)} · <a href="tel:${E(o.userPhone)}">📞 ${E(o.userPhone)}</a></div>
<div><a href="https://maps.google.com/?q=${encodeURIComponent(o.address||'')}" target="_blank">📍 ${E(o.address)}</a></div>
${detailsHtml(o)}
<div class="sp"><b>৳${o.totalAmount||0}</b>${act?`<span style="display:flex;gap:6px"><button class="r" style="width:auto" onclick="retO('${o.id}')">ফেরত</button><button class="g" style="width:auto" onclick="openPay('${o.id}')">ডেলিভারি হয়েছে</button></span>`:`<span>${E(grp(o)=='Delivered'?o.paymentMethod:o.returnReason)}</span>`}</div>${act?'':`<small>${E(fdt(od(o)))}</small>`}</div>`;
function renderR(){const c=$('rlist');$('dF').hidden=rt!='done';$('hF').hidden=rt!='h';
if(rt=='p'){c.innerHTML=`<div class="c">${profHtml(me,false)}</div>`;return}
if(rt=='h'){const B=hBase();fill('hs2',[['ALL','সব',B.length],['Pending','অপেক্ষায়',cn(B,'Pending')],['Approved','অনুমোদিত',cn(B,'Approved')],['Rejected','বাতিল',cn(B,'Rejected')]]);
c.innerHTML=hList().map(s=>`<div class="c"><div class="sp"><b>৳${N(s.amount)}</b><span class="b">${stT(s.status)}</span></div><small>${E(s.method)} · ${E(s.trxRef)||'—'} · ${E(fdt(s.createdAt))}</small><div>🧾 ${E(invNo(s))||'<small>পুরনো জমা (ইনভয়েস ছাড়া)</small>'}</div></div>`).join('')||'<small>কিছু নেই</small>';return}
if(rt=='done'){const B=dBase();fill('ds',[['ALL','সব',B.length],['Delivered','Delivered',cg(B,'Delivered')],['Returned','Returned',cg(B,'Returned')],['Cancelled','Cancelled',cg(B,'Cancelled')]]);
c.innerHTML=dList().map(o=>rCard(o,0)).join('')||'<small>কোনো অর্ডার নেই</small>';return}
c.innerHTML=orders.filter(o=>o.offerState!='Offered'&&!FIN.includes(o.status)).map(o=>rCard(o,1)).join('')||'<small>কোনো অর্ডার নেই</small>'}


function checkOffer(){const o=orders.find(x=>x.offerState=='Offered'&&!FIN.includes(x.status));if(!o){hideOffer();return}
if(offerId==o.id)return;offerId=o.id;
$('offT').innerHTML=`<p><b>${E(o.orderId||o.id)}</b> · ৳${o.totalAmount||0}</p><p>📍 ${E(o.address)}</p><p>👤 ${E(o.userName)}</p>`;
$('offer').hidden=false;startRing();let t=60;$('cd').textContent=t;clearInterval(cdT);
cdT=setInterval(()=>{$('cd').textContent=--t;if(t<=0)respond(false)},1000)}
function hideOffer(){offerId=null;$('offer').hidden=true;stopRing();clearInterval(cdT)}
window.respond=async ok=>{const id=offerId;hideOffer();if(!id)return;
try{await updateDoc(doc(db,'orders',id),ok?{offerState:'Accepted',acceptedAt:iso()}:{status:'Processing',riderPhone:'',riderId:'',riderName:'',assignedRiderId:'',assignedRiderName:'',offerState:'',offeredAt:''})}catch(e){alert(e.message)}};

window.openPay=id=>{payId=id;$('payAmt').textContent='৳'+orders.find(o=>o.id==id).totalAmount;$('pay').hidden=false};
window.donePay=async()=>{if(busyF)return;const o=orders.find(x=>x.id==payId);if(!o||FIN.includes(o.status))return;
const rd=isAd?riders.find(r=>r.phone==o.riderPhone):me,m=$('pm').value,amt=Number(o.totalAmount||0),com=rd?(rd.deliveryCommission==null?30:Number(rd.deliveryCommission)||0):0;busyF=1;
try{const b=writeBatch(db);b.update(doc(db,'orders',payId),{status:'Delivered',paymentMethod:m,paymentTrxId:$('trx').value.trim(),deliveredAt:iso(),...(isAd?{deliveredBy:'admin'}:{})});
if(rd)b.update(doc(db,'riders',rd.id),{...(m=='Cash'?{cashBalance:increment(amt)}:{}),earningsBalance:increment(com)});
await b.commit();$('pay').hidden=true;$('trx').value='';alert('সম্পন্ন!'+(rd?' কমিশন ৳'+com:''))}catch(e){alert('ব্যর্থ: '+e.message)}busyF=0};

window.retO=async id=>{const r=prompt('ফেরতের কারণ লিখুন');if(r===null)return;if(!r.trim())return alert('কারণ লিখুন');if(!confirm('অর্ডারটি ফেরত (Returned) দিচ্ছেন?'))return;
try{await updateDoc(doc(db,'orders',id),{status:'Returned',returnReason:r.trim().slice(0,200),returnedAt:iso()})}catch(e){alert(e.message)}};


const netOf=o=>Math.max(0,N(o.totalAmount)-N(o.reversedCash));
const unpaid=()=>{const u=new Set();stls.forEach(x=>x.status!='Rejected'&&(x.invoices||[]).forEach(i=>u.add(i.id)));
return orders.filter(o=>o.status=='Delivered'&&o.paymentMethod=='Cash'&&!o.cashSettled&&!u.has(o.id)&&netOf(o)>0&&(!INV_FROM||ld(o.deliveredAt)>=INV_FROM)).sort((a,b)=>(a.deliveredAt||'')<(b.deliveredAt||'')?-1:1)};
window.openStl=()=>{const u=unpaid();$('sCb').textContent='ক্যাশ বাকি: ৳'+N(me.cashBalance);
$('sl').innerHTML=u.map(o=>`<label class="sp" style="border-bottom:1px dashed #e5e7eb;padding:4px 0"><span><input type="checkbox" class="ck" value="${E(o.id)}" data-a="${netOf(o)}" onchange="sumS()" style="width:auto;margin-right:6px">${E(o.orderId||o.id)}<br><small>${E(fdt(o.deliveredAt))}</small></span><b>${tk(netOf(o))}</b></label>`).join('')||'<small>জমা দেওয়ার মতো কোনো Unpaid ইনভয়েস নেই</small>';sumS();$('stl').hidden=false};
window.sumS=()=>{$('sT').textContent=tk([...document.querySelectorAll('#sl .ck:checked')].reduce((s,x)=>s+N(x.dataset.a),0))};
window.sendStl=async()=>{const ck=[...document.querySelectorAll('#sl .ck:checked')];if(!ck.length)return alert('কমপক্ষে একটি Unpaid ইনভয়েস সিলেক্ট করুন');

const a=inv.reduce((s,o)=>s+netOf(o),0),c=N(me.cashBalance);if(!(a>0)||a>c)return alert('ক্যাশ বাকি ৳'+c+', নির্বাচিত ইনভয়েস ৳'+a+' — মিলছে না');

const N=v=>Number(v)||0,openD=new Set(),tk=v=>'৳'+(Math.round(N(v)*100)/100);
function calc(o){const it=o.items||[],sub=N(o.subtotal)||it.reduce((s,i)=>s+N(i.price)*N(i.qty),0),rows=[['পণ্যের মোট',sub]];let t=sub;
const sav=it.reduce((s,i)=>s+(N(i.mrp)>N(i.price)?(N(i.mrp)-N(i.price))*N(i.qty):0),0);
const ds=Array.isArray(o.discounts)&&o.discounts.length?o.discounts:(N(o.discount)>0?[{label:'কুপন',code:o.couponCode,amount:o.discount}]:[]);

['walletUsed','pointsUsed'].forEach(k=>{if(N(o[k])){rows.push([k=='walletUsed'?'ওয়ালেট থেকে':'পয়েন্ট থেকে',-N(o[k])]);t-=N(o[k])}});

w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${E(o.orderId||o.id)}</title><style>@page{size:80mm auto;margin:4mm}body{font:12px Arial,sans-serif;width:72mm;margin:0 auto;color:#000}h3,p{margin:2px 0;text-align:center}table{width:100%;border-collapse:collapse;margin:6px 0}td,th{padding:3px 0;border-bottom:1px dashed #999;text-align:left;vertical-align:top}.r{text-align:right}.s{display:flex;justify-content:space-between}.b{border-top:2px solid #000;margin-top:4px;padding-top:4px;font-weight:700;font-size:14px}.n{border:1px solid #000;padding:4px;margin-top:6px;text-align:center;font-weight:700}@media print{button{display:none}}</style></head><body>
<h3>Laland Express</h3><p>ডেলিভারি মেমো</p><p><b>${E(o.orderId||o.id)}</b></p><p>${o.createdAt?E(new Date(o.createdAt).toLocaleString()):''}</p><hr>
<p style="text-align:left"><b>গ্রাহক:</b> ${E(o.userName)}<br><b>মোবাইল:</b> ${E(o.userPhone)}<br><b>ঠিকানা:</b> ${E(o.address)}${o.note?'<br><b>নোট:</b> '+E(o.note):''}${o.riderName?'<br><b>রাইডার:</b> '+E(o.riderName)+(o.riderPhone?' ('+E(o.riderPhone)+')':''):''}</p>
<table><tr><th>পণ্য</th><th class="r">পরিমাণ</th><th class="r">টাকা</th></tr>${it.map(i=>`<tr><td>${E(i.name)}<br>${tk(i.price)}</td><td class="r">${N(i.qty)}</td><td class="r">${tk(N(i.price)*N(i.qty))}</td></tr>`).join('')}</table>
${c.rows.map(r=>`<div class="s"><span>${E(r[0])}</span><span>${r[2]||(r[1]<0?'−':'')+tk(Math.abs(r[1]))}</span></div>`).join('')}
<div class="s b"><span>সর্বমোট</span><span>${tk(c.stored)}</span></div><div class="n">গ্রাহকের কাছ থেকে নিতে হবে: ${tk(c.stored)}</div>
<p style="margin-top:8px">☐ পণ্য বুঝে নিয়েছি (রাইডারের স্বাক্ষর): ________</p><p>ধন্যবাদ!</p><button onclick="print()" style="width:100%;padding:10px;margin-top:8px">🖨 প্রিন্ট</button></body></html>`);
w.document.close();setTimeout(()=>w.print(),400)};
</script></body></html>
