<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Login - Laland Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow border overflow-hidden">
    <div class="bg-emerald-700 text-white p-5 text-center">
      <i class="fa-solid fa-truck-field text-3xl mb-2"></i>
      <h1 class="font-bold text-lg">Supplier Portal</h1>
      <p class="text-xs text-emerald-200">Laland Express / Good Mart Enterprise</p>
    </div>
    <form id="loginForm" class="p-5 space-y-3">
      <div>
        <label class="text-xs text-gray-600 block mb-1">Mobile Number</label>
        <input type="tel" id="mobile" required placeholder="017XXXXXXXX" class="w-full px-3 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <div>
        <label class="text-xs text-gray-600 block mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-3 py-2.5 border rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <p id="msg" class="text-xs text-red-600 hidden"></p>
      <button id="btn" type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-emerald-700">Login</button>
      <p class="text-[11px] text-gray-400 text-center">Forgot password? Contact the admin.</p>
    </form>
  </div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const cfg = { apiKey: "AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U", authDomain: "laland-express.firebaseapp.com", projectId: "laland-express", storageBucket: "laland-express.firebasestorage.app", messagingSenderId: "315462688826", appId: "1:315462688826:web:a6b033e1ce664071201503" };
    const app = getApps().length ? getApp() : initializeApp(cfg);
    const auth = getAuth(app), db = getFirestore(app);
    const $ = id => document.getElementById(id);
    const normalize = m => { let d = String(m).replace(/\D/g, ''); if (d.startsWith('880')) d = '0' + d.slice(3); return d; };
    const show = t => { $('msg').textContent = t; $('msg').classList.remove('hidden'); };
    let busy = false;

    async function isActiveSupplier(uid) {
      const s = await getDoc(doc(db, 'supplier_users', uid));
      return s.exists() && s.data().active !== false;
    }

    // Already signed in as a supplier -> go straight to portal
    onAuthStateChanged(auth, async (u) => {
      if (!u || busy) return;
      try { if (await isActiveSupplier(u.uid)) location.replace('portal.html'); } catch (e) {}
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      busy = true; $('msg').classList.add('hidden'); $('btn').disabled = true; $('btn').textContent = 'Signing in...';
      try {
        const cred = await signInWithEmailAndPassword(auth, normalize($('mobile').value) + '@supplier.laland.app', $('password').value);
        if (!(await isActiveSupplier(cred.user.uid))) {
          await signOut(auth);
          show('This login is not active. Please contact the admin.');
        } else {
          location.replace('portal.html'); return;
        }
      } catch (err) {
        show('Wrong mobile number or password.');
      }
      busy = false; $('btn').disabled = false; $('btn').textContent = 'Login';
    });
  </script>
</body>
</html>
