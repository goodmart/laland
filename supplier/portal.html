<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Portal - Laland Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style id="gate">html{visibility:hidden}</style>
</head>
<body class="bg-gray-100 text-gray-800 pb-16">
  <header class="bg-emerald-700 text-white shadow sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div><p class="text-[10px] text-emerald-200">Supplier Portal</p><h1 id="coName" class="font-bold text-sm">...</h1></div>
      <button onclick="logout()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg font-bold"><i class="fa-solid fa-right-from-bracket mr-1"></i>Logout</button>
    </div>
    <div class="max-w-4xl mx-auto px-2 flex text-xs font-bold">
      <button id="tab-products" onclick="showTab('products')" class="tabbtn flex-1 py-2.5 border-b-2">Products & Stock</button>
      <button id="tab-newpo" onclick="showTab('newpo')" class="tabbtn flex-1 py-2.5 border-b-2">New PO <span id="cartCount" class="ml-1 bg-amber-400 text-gray-900 rounded-full px-1.5 hidden"></span></button>
      <button id="tab-mypos" onclick="showTab('mypos')" class="tabbtn flex-1 py-2.5 border-b-2">My POs</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <!-- PRODUCTS -->
    <section id="view-products" class="space-y-3">
      <input id="prodSearch" oninput="renderProducts()" placeholder="Search your products..." class="w-full px-3 py-2 border rounded-xl text-sm bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500">
      <div id="prodList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
    </section>

    <!-- NEW PO -->
    <section id="view-newpo" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
        <h3 class="font-bold text-sm text-emerald-700"><i class="fa-solid fa-file-circle-plus mr-1"></i> Create Purchase Order</h3>
        <div id="cartList" class="space-y-2"></div>
        <textarea id="poNote" rows="2" placeholder="Note for admin (optional)" class="w-full px-3 py-2 border rounded-xl text-xs focus:outline-none"></textarea>
        <div class="flex justify-between items-center pt-2 border-t">
          <p class="text-xs text-gray-600">Total: <strong id="cartTotal" class="text-emerald-700">৳ 0</strong></p>
          <button id="submitPoBtn" onclick="submitPo()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-emerald-700">Submit PO for Approval</button>
        </div>
        <p class="text-[10px] text-gray-400">After submitting, you cannot edit the PO. The admin may correct quantities or prices before approving.</p>
      </div>
    </section>

    <!-- MY POs -->
    <section id="view-mypos" class="hidden space-y-2"><div id="poList" class="space-y-2"></div></section>
  </main>

  <!-- PO DETAIL MODAL -->
  <div id="poModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="mTitle" class="font-bold text-sm text-emerald-700"></h3>
        <button onclick="closeModal()" class="text-xl px-2 text-gray-500">&times;</button>
      </div>
      <div id="mBody" class="space-y-3 text-xs"></div>
      <div id="mActions" class="flex flex-wrap gap-2 justify-end pt-2 border-t"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, getDocs, addDoc, updateDoc, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    const cfg = { apiKey: "AIzaSyCP0heHxeSJezxkAyvYAkGdFenY4ErhV0U", authDomain: "laland-express.firebaseapp.com", projectId: "laland-express", storageBucket: "laland-express.firebasestorage.app", messagingSenderId: "315462688826", appId: "1:315462688826:web:a6b033e1ce664071201503" };
    const app = getApps().length ? getApp() : initializeApp(cfg);
    const auth = getAuth(app), db = getFirestore(app);
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const COLORS = { Submitted: 'bg-blue-100 text-blue-700', 'Under Review': 'bg-amber-100 text-amber-700', Approved: 'bg-emerald-100 text-emerald-700', Rejected: 'bg-red-100 text-red-700', Cancelled: 'bg-gray-200 text-gray-600', 'Partially Received': 'bg-purple-100 text-purple-700', Received: 'bg-emerald-200 text-emerald-800' };
    const badge = s => `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${COLORS[s] || 'bg-gray-100'}">${esc(s)}</span>`;
    let me = null, products = [], pos = [], cart = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace('index.html'); return; }
      try {
        const s = await getDoc(doc(db, 'supplier_users', user.uid));
        if (!s.exists()) { location.replace('index.html'); return; }
        if (s.data().active === false) { await signOut(auth); location.replace('index.html'); return; }
        me = { uid: user.uid, ...s.data() };
        $('coName').textContent = me.companyName;
        $('gate').remove();
        showTab('products');
        await Promise.all([loadProducts(), loadPos()]);
      } catch (e) { alert('Error: ' + e.message); }
    });

    window.logout = async () => { await signOut(auth); location.replace('index.html'); };

    window.showTab = (t) => {
      ['products', 'newpo', 'mypos'].forEach(x => {
        $('view-' + x).classList.toggle('hidden', x !== t);
        $('tab-' + x).className = 'tabbtn flex-1 py-2.5 border-b-2 ' + (x === t ? 'border-white' : 'border-transparent text-emerald-200');
      });
      if (t === 'newpo') renderCart();
    };

    async function loadProducts() {
      const snap = await getDocs(query(collection(db, 'products'), where('supplier', '==', me.companyName)));
      products = []; snap.forEach(d => products.push({ id: d.id, ...d.data() }));
      products.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      renderProducts();
    }

    window.renderProducts = () => {
      const q = $('prodSearch').value.toLowerCase().trim();
      const list = products.filter(p => !q || (p.name || '').toLowerCase().includes(q));
      $('prodList').innerHTML = list.length ? list.map(p => {
        const stock = Number(p.stock || 0), low = stock <= Number(p.minStock ?? 10);
        return `<div class="bg-white p-3 rounded-xl border flex justify-between items-center gap-2">
          <div class="min-w-0">
            <p class="font-bold text-sm truncate">${esc(p.name)}</p>
            <p class="text-[11px] text-gray-500">TP: ৳${Number(p.tp || 0)}</p>
            <p class="text-xs font-bold ${low ? 'text-red-600' : 'text-emerald-700'}">Stock: ${stock} ${low ? '<span class="text-[10px] bg-red-100 px-1.5 rounded">LOW</span>' : ''}</p>
          </div>
          <button onclick="addToPo('${p.id}')" class="shrink-0 bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>PO</button>
        </div>`;
      }).join('') : '<p class="col-span-2 text-center text-xs text-gray-400 py-6">No products found.</p>';
    };

    window.addToPo = (id) => {
      const p = products.find(x => x.id === id); if (!p) return;
      if (!cart.find(c => c.id === id)) cart.push({ id, name: p.name, stock: Number(p.stock || 0), tp: Number(p.tp || 0), qty: 1, proposedTp: '' });
      updateCartCount(); showTab('newpo');
    };
    const updateCartCount = () => { $('cartCount').textContent = cart.length; $('cartCount').classList.toggle('hidden', !cart.length); };

    function renderCart() {
      $('cartList').innerHTML = cart.length ? cart.map((c, i) => `
        <div class="border rounded-xl p-3 space-y-2">
          <div class="flex justify-between"><p class="font-bold text-sm">${esc(c.name)}</p><button onclick="cartRemove(${i})" class="text-red-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
          <p class="text-[11px] text-gray-500">Current stock: ${c.stock} | TP: ৳${c.tp}</p>
          <div class="grid grid-cols-2 gap-2">
            <label class="text-[10px] text-gray-500">Quantity<input type="number" min="1" value="${c.qty}" onchange="cartSet(${i},'qty',this.value)" class="w-full px-2 py-1.5 border rounded-lg text-sm"></label>
            <label class="text-[10px] text-gray-500">Proposed price (optional)<input type="number" min="0" value="${c.proposedTp}" placeholder="৳${c.tp}" onchange="cartSet(${i},'proposedTp',this.value)" class="w-full px-2 py-1.5 border rounded-lg text-sm"></label>
          </div>
          <p class="text-right text-xs font-bold text-emerald-700">৳ ${c.qty * c.tp}</p>
        </div>`).join('') : '<p class="text-center text-xs text-gray-400 py-6">No items yet. Add products from the Products tab.</p>';
      $('cartTotal').textContent = '৳ ' + cart.reduce((s, c) => s + c.qty * c.tp, 0);
    }
    window.cartSet = (i, f, v) => { if (f === 'qty') cart[i].qty = Math.max(1, Math.floor(Number(v) || 1)); else cart[i].proposedTp = v === '' ? '' : Math.max(0, Number(v)); renderCart(); };
    window.cartRemove = (i) => { cart.splice(i, 1); updateCartCount(); renderCart(); };

    window.submitPo = async () => {
      if (!cart.length) { alert('Add at least one product.'); return; }
      if (!confirm('Submit this PO to admin for approval?')) return;
      const now = new Date().toISOString();
      const items = cart.map(c => ({ id: c.id, name: c.name, qty: c.qty, tp: c.tp, supplierQty: c.qty, supplierTp: c.tp, proposedTp: c.proposedTp === '' ? null : Number(c.proposedTp), receivedQty: 0 }));
      const po = {
        poNo: 'PO-' + Math.floor(100000 + Math.random() * 900000),
        supplierId: me.supplierId, supplier: me.companyName, items,
        totalItems: items.reduce((s, i) => s + i.qty, 0),
        totalCost: items.reduce((s, i) => s + i.qty * i.tp, 0),
        status: 'Submitted', note: $('poNote').value.trim(), correctionNote: '',
        createdBy: me.uid, createdAt: now,
        history: [{ at: now, by: me.companyName, action: 'Submitted', note: '' }]
      };
      $('submitPoBtn').disabled = true;
      try {
        await addDoc(collection(db, 'purchase_orders'), po);
        cart = []; $('poNote').value = ''; updateCartCount();
        await loadPos(); showTab('mypos');
        alert('PO submitted: ' + po.poNo);
      } catch (e) { alert('Error: ' + e.message); }
      $('submitPoBtn').disabled = false;
    };

    async function loadPos() {
      const snap = await getDocs(query(collection(db, 'purchase_orders'), where('supplierId', '==', me.supplierId)));
      pos = []; snap.forEach(d => pos.push({ docId: d.id, ...d.data() }));
      pos.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      $('poList').innerHTML = pos.length ? pos.map((p, i) => `
        <div onclick="openPo(${i})" class="bg-white p-3 rounded-xl border cursor-pointer hover:bg-emerald-50 flex justify-between items-center">
          <div><p class="font-bold text-sm">${esc(p.poNo)}</p><p class="text-[11px] text-gray-500">${new Date(p.createdAt).toLocaleDateString()} | ${p.totalItems} pcs</p></div>
          <div class="text-right space-y-1"><p class="font-bold text-sm text-emerald-700">৳ ${p.totalCost}</p>${badge(p.status)}</div>
        </div>`).join('') : '<p class="text-center text-xs text-gray-400 py-6">No purchase orders yet.</p>';
    }

    window.openPo = (i) => {
      const p = pos[i];
      $('mTitle').textContent = p.poNo;
      const rows = p.items.map(it => {
        const changed = it.qty !== it.supplierQty || it.tp !== it.supplierTp;
        return `<tr class="border-b"><td class="p-1.5">${esc(it.name)}${it.proposedTp != null && it.proposedTp !== it.tp ? `<span class="block text-[10px] text-gray-400">You proposed ৳${it.proposedTp}</span>` : ''}</td>
          <td class="p-1.5 text-center">${changed && it.qty !== it.supplierQty ? `<s class="text-gray-400">${it.supplierQty}</s> ` : ''}<b>${it.qty}</b>${p.status.includes('Received') ? `<span class="block text-[10px] text-purple-600">got ${it.receivedQty || 0}</span>` : ''}</td>
          <td class="p-1.5 text-right">${changed && it.tp !== it.supplierTp ? `<s class="text-gray-400">৳${it.supplierTp}</s> ` : ''}৳${it.tp}</td>
          <td class="p-1.5 text-right font-bold">৳${it.qty * it.tp}</td></tr>`;
      }).join('');
      $('mBody').innerHTML = `
        <div class="flex justify-between items-center">${badge(p.status)}<span class="text-gray-500">${new Date(p.createdAt).toLocaleString()}</span></div>
        <table class="w-full text-left"><thead><tr class="bg-gray-50 text-gray-500"><th class="p-1.5">Product</th><th class="p-1.5 text-center">Qty</th><th class="p-1.5 text-right">TP</th><th class="p-1.5 text-right">Total</th></tr></thead><tbody>${rows}</tbody></table>
        <p class="text-right font-extrabold text-emerald-700 text-sm">Total: ৳ ${p.totalCost}</p>
        ${p.note ? `<p><b>Your note:</b> ${esc(p.note)}</p>` : ''}
        ${p.correctionNote ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-2"><b>Admin correction note:</b> ${esc(p.correctionNote)}</div>` : ''}
        <div><p class="font-bold mb-1">History</p>${(p.history || []).map(h => `<p class="text-gray-500">• ${new Date(h.at).toLocaleString()} - <b>${esc(h.action)}</b> ${h.note ? '(' + esc(h.note) + ')' : ''}</p>`).join('')}</div>`;
      $('mActions').innerHTML = `
        ${p.status === 'Submitted' ? `<button onclick="cancelPo(${i})" class="bg-red-100 text-red-700 px-3 py-2 rounded-xl font-bold text-xs">Cancel PO</button>` : ''}
        <button onclick="printPo(${i})" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-bold text-xs"><i class="fa-solid fa-print mr-1"></i>PO Invoice</button>`;
      $('poModal').classList.remove('hidden');
    };
    window.closeModal = () => $('poModal').classList.add('hidden');

    window.cancelPo = async (i) => {
      const p = pos[i];
      if (!confirm('Cancel ' + p.poNo + '?')) return;
      try {
        await updateDoc(doc(db, 'purchase_orders', p.docId), { status: 'Cancelled', history: [...(p.history || []), { at: new Date().toISOString(), by: me.companyName, action: 'Cancelled', note: '' }] });
        closeModal(); await loadPos();
      } catch (e) { alert('Error: ' + e.message); }
    };

    window.printPo = (i) => {
      const p = pos[i];
      const w = window.open('', '_blank'); if (!w) { alert('Please allow popups.'); return; }
      const ok = ['Approved', 'Partially Received', 'Received'].includes(p.status);
      const rows = p.items.map(it => `<tr><td style="padding:6px;border-bottom:1px solid #ddd">${esc(it.name)}</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:center">${it.qty}</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:right">৳ ${it.tp}</td><td style="padding:6px;border-bottom:1px solid #ddd;text-align:right">৳ ${it.qty * it.tp}</td></tr>`).join('');
      w.document.write(`<html><head><title>PO Invoice - ${esc(p.poNo)}</title><style>body{font-family:Arial,sans-serif;padding:20px;color:#333}table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}th{background:#f3f4f6;padding:6px;text-align:left}</style></head><body>
        <div style="text-align:center;border-bottom:2px solid #047857;padding-bottom:10px"><h2>Laland Express / Good Mart Enterprise</h2><p style="font-size:11px">Kamarpara, Rangpur | Purchase Order Invoice</p><p style="color:#047857"><b>PO No:</b> ${esc(p.poNo)}</p></div>
        <p style="font-size:13px"><b>Supplier:</b> ${esc(p.supplier)}<br><b>Date:</b> ${new Date(p.createdAt).toLocaleString()}<br><b>Status:</b> <span style="font-weight:bold;color:${ok ? '#047857' : '#b45309'}">${ok ? 'APPROVED' : esc(p.status).toUpperCase() + ' (not yet approved)'}</span></p>
        <table><thead><tr><th>Product</th><th style="text-align:center">Qty</th><th style="text-align:right">TP</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows}</tbody></table>
        <p style="text-align:right;font-weight:bold;font-size:15px;margin-top:15px">Total: ৳ ${p.totalCost}</p>
        ${p.correctionNote ? `<p style="font-size:12px"><b>Admin note:</b> ${esc(p.correctionNote)}</p>` : ''}
        </body></html>`);
      w.document.close(); w.print();
    };
  </script>
</body>
</html>
